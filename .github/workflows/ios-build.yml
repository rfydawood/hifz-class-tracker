name: iOS build check

# Builds the iOS app for the simulator, unsigned, to prove the Xcode project
# still compiles. No Apple Developer account needed. Free on a public repo.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['capacitor-app/**', '.github/workflows/ios-build.yml']
  pull_request:
    paths: ['capacitor-app/**', '.github/workflows/ios-build.yml']

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and sync
        working-directory: capacitor-app
        run: |
          npm ci
          npx cap sync ios
      - name: Build for simulator (unsigned)
        working-directory: capacitor-app/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
