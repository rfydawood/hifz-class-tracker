<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hifz Class Tracker</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E3EAEC;color:#1F2E36;font:16px/1.5 system-ui,"Segoe UI",sans-serif}
  .card{background:#fff;border-radius:16px;padding:32px 28px;max-width:380px;margin:16px;text-align:center;box-shadow:0 4px 20px rgba(31,46,54,.12)}
  h1{font-size:20px;margin:0 0 8px}
  p{margin:0 0 20px;color:#5b6b73}
  button{font:inherit;font-weight:600;background:#1F2E36;color:#fff;border:0;border-radius:10px;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <h1>Connect to the internet</h1>
  <p>The first time it opens, Hifz Class Tracker needs an internet connection. After that it works offline too.</p>
  <button onclick="location.href=new URLSearchParams(location.search).get('retry')">Try again</button>
</div>
</body>
</html>
