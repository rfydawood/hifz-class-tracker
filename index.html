<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hifz Class Tracker</title>
<meta name="description" content="Classroom attendance and break tracker for hifz teachers. Works offline, data stays on this device.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2E36">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hifz Tracker">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2E36; --leaf:#0F7B7B; --leaf-soft:#DCEDED;
  --gold:#D39A22; --gold-soft:#FBF0D8; --ember:#C0503A; --ember-soft:#F8E5E0;
  --paper:#F2F5F6; --card:#FFFFFF; --line:#D6DFE2; --mute:#5B6B73;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E3EAEC;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:inherit}

/* overflow:clip, not just hidden. The teacher drawer waits off the right edge
   (left:100%), which gives .app 40-odd px of sideways scroll room - and
   'hidden' still lets the browser scroll that room programmatically. A tap
   landing during a sheet's slide-in did exactly that: the whole app slid
   left and the drawer peeked in from the edge. clip removes the scroll room
   itself. 'hidden' stays first for any engine too old to know clip. */
.app{max-width:1600px;width:100%;height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;overflow:clip;position:relative}
/* Until boot() has painted the real class, the page is the empty static
   shell - "Hifz Class", no students, "In class 0". On the tablet that showed
   for about a second after the splash, and it reads as real data: it is what
   looked like "the app lost my class" at the very start of this project.
   visibility, not display, so the layout still exists for fitGrid() to
   measure on that first render. */
.app.booting>*{visibility:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,1.6vw,16px);padding:clamp(14px,3.6vh,22px) clamp(9px,1.6vw,18px);background:var(--ink);color:#EEF3F4}
.top-left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;min-height:0}
.top h1{font-size:clamp(18px,2.9vw,23px);font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.top-row2{display:flex;align-items:center;gap:6px;min-width:0}
.top .sub{flex:1 1 auto;min-width:0;font-size:clamp(10px,1.4vw,13px);color:#A6BFC7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{flex:none;display:flex;align-items:center;gap:10px}
.when{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1}
.top .clock{font-size:clamp(24px,7.5vw,34px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.top .date{font-size:clamp(12px,3.4vw,16px);font-weight:700;white-space:nowrap;color:#A6BFC7;line-height:1.2}
.pill{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);white-space:nowrap;flex:none}
.pill b{font-size:13px}
.pill.out{background:var(--gold);color:var(--ink)}
.pill.absent{background:rgba(255,255,255,.08);color:#BDCED4}
.start-btn{background:var(--leaf);color:#fff;padding:8px 13px;border-radius:11px;font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.start-btn.end{background:var(--ember)}
.start-btn.lunch{background:var(--gold);color:var(--ink)}
.menu-btn{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px;stroke:#EEF3F4;stroke-width:2.2;fill:none;stroke-linecap:round}

.banner{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--gold-soft);border-bottom:1px solid #E5C57E;font-weight:700;font-size:15px}
.banner.leaf{background:var(--leaf-soft);border-color:#BBD9D9}
.banner.paper{background:#fff;border-color:var(--line);color:var(--mute);font-weight:600}
.banner .act{margin-left:auto;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;font-size:14px}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr clamp(212px,24%,320px);gap:10px;padding:10px 12px 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;font-weight:700}
.panel-head .hint{color:var(--mute);font-size:13px;margin-left:auto}

.grid{flex:1;padding:10px;display:grid;gap:8px;overflow:auto;align-content:start}
.tile{position:relative;border-radius:13px;padding:clamp(5px,1vh,10px) clamp(7px,0.9vw,11px);min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;border:2px solid transparent;transition:transform .1s}
.tile:active{transform:scale(.97)}
@media (hover:hover){.tile:hover{border-color:var(--leaf)}.dbtn:hover,.reason:hover{border-color:var(--leaf)}}
@media (max-width:560px){
  /* stacked: the roster takes the space, the out list only what it needs */
  .stage{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .stage>.panel:last-child{max-height:36vh}
  #outList{overflow:auto}
  /* nobody out: the header pill already says so, so give the space to the roster */
  .stage.no-out{grid-template-rows:1fr}
  .stage.no-out>.panel:last-child{display:none}
}
.tile .name{font-size:var(--name,16px);font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow-wrap:break-word}
.tile .state{font-size:var(--sub,12px);font-weight:600;margin-top:auto;padding-top:3px;color:var(--mute);font-variant-numeric:tabular-nums}
.grid.dense .tile.present .state{display:none}
.tile .name{flex:none}
.grid.dense .tile .tag{margin-bottom:1px}
.tile.present{background:#E7F1F1;border-color:#CFE2E2}
.tile.present .state{color:#0C5C5C}
.tile.deact{background:#EDF1F2;color:#7D8D95;border-style:dashed;border-color:#C6D2D6}
/* Left early reads as "was here, has gone" - muted like a no-show, but no
   strike-through, because the day still counts as attended. */
.tile.gone{background:#EDF1F2;color:#5B6B73;border-color:#C6D2D6}
.tile.gone .state{color:#5B6B73;font-weight:700}
.tile.gone .tag{background:#E2E8EA;color:#6B7A81}
.tile.deact .name{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#B6C4C9}
.tile.deact .state{color:#7D8D95}
.tile.out{background:var(--gold-soft);border-color:var(--gold)}
.tile.out .state{color:#6B4B0C;font-weight:800;font-size:var(--sub,13px)}
.tile.out.long{background:var(--ember-soft);border-color:var(--ember)}
.tile.out.long .state{color:var(--ember)}
.tile .tag{align-self:flex-start;order:-1;margin-bottom:2px;font-size:var(--tag,10px);font-weight:700;padding:2px 6px;border-radius:6px;background:var(--gold-soft);color:#6B4B0C}
.tile .tag.flag{background:var(--ember-soft);color:var(--ember)}
.tile.deact .tag{background:#E2E8EA;color:#6B7A81}
.tile:disabled{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){.tile,.sheet{transition:none;animation:none}}

.out-list{flex:1;overflow:auto;padding:12px}
.out-item{display:grid;grid-template-columns:1fr auto;column-gap:8px;row-gap:6px;align-items:center;padding:clamp(5px,1vh,9px) 10px;border-radius:12px;background:var(--gold-soft);border:1px solid #E5C57E;margin-bottom:8px}
.out-item.long{background:var(--ember-soft);border-color:#E4B4A6}
#outList.compact .out-item{row-gap:0;padding:5px 8px;margin-bottom:5px}
#outList.compact .out-item .who span{display:none}
#outList.compact .out-item .back{grid-column:2;grid-row:2;padding:4px 9px;font-size:12px}
.out-item .who{grid-column:1;grid-row:1;min-width:0}
.out-item .who b{display:block;font-size:clamp(13px,1.7vw,16px);font-weight:800;line-height:1.15}
.out-item .who span{display:block;font-size:11px;line-height:1.3;color:var(--mute)}
.out-item .t{grid-column:2;grid-row:1;justify-self:end;font-size:clamp(16px,2.2vw,21px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.out-item.long .t{color:var(--ember)}
.out-item .back{grid-column:1/-1;grid-row:2;text-align:center;background:var(--ink);color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.reasons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.reason .cap{overflow-wrap:anywhere;text-align:center}
.reason{border:2px solid var(--line);border-radius:18px;padding:20px 12px;font-size:19px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--card)}
.reason .cap{font-size:12px;font-weight:700;color:var(--mute)}
.reason.capped{border-color:var(--ember);background:var(--ember-soft)}
.reason.capped .cap{color:var(--ember)}
.stepper{display:flex;align-items:stretch;justify-content:center;gap:14px}
.step-btn{width:68px;height:68px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:34px;font-weight:800;color:var(--ink);display:grid;place-items:center;flex:none;line-height:1}
.step-btn:active{border-color:var(--gold);background:var(--gold-soft)}
.step-num{width:120px;height:68px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.reason:active{border-color:var(--gold);background:var(--gold-soft)}
.reason svg{width:40px;height:40px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.reason{position:relative}
.rdot{position:absolute;top:12px;left:12px;width:10px;height:10px;border-radius:50%}
.washroom{background:#2F8F6B}
.water{background:#2E7FB5}
.wudhu{background:#6B5CA5}
.assigned{background:#C0803A}
.other{background:#93A3A9}
.bdots{margin-left:auto;margin-right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:6px}
.bdots .d{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.bdots .d i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.bdots .d i.flagged{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 0 2px var(--ember)}
.bdots span{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.bdots + .x{margin-left:0}

.scrim{position:absolute;inset:0;background:rgba(31,46,54,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.scrim.show{display:flex}
.sheet{width:100%;max-width:720px;max-height:100%;background:var(--card);border-radius:22px;padding:22px 24px 24px;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:flex-start;gap:14px}
.sheet h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sheet p{color:var(--mute);margin-top:4px;font-size:15px;line-height:1.4}
.sheet .x{margin-left:auto;width:44px;height:44px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sheet .x svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.sheet .body{flex:1;overflow:auto;margin-top:16px;min-height:0}
.actions{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;border-radius:14px;padding:16px;font-size:17px;font-weight:800;text-align:center}
.btn.primary{background:var(--leaf);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line)}
.btn.warn{background:var(--ember);color:#fff}
.note{margin-top:14px}
.note input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;background:var(--paper)}
.rowlist{display:flex;flex-direction:column;gap:8px}
.dsrow{cursor:pointer}
.brow b{flex:0 1 auto;min-width:92px}
.brow .time:first-of-type{margin-left:auto}
.brow .btn{flex:none}
/* the two smaller actions under the break reasons share a row, so neither is pushed below the fold on a short screen */
.leftrow{display:flex;gap:10px;margin-top:14px}
.leftrow .leftday{margin-top:0;flex:1}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.row b{flex:1;font-size:16px}
.row .time{color:var(--mute);font-size:13px;min-width:130px;text-align:right}
.seg{display:inline-flex;background:var(--card);border:1px solid #C6D2D6;border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;font-weight:700;color:var(--mute);border-right:1px solid #E4EBED}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on.absent{background:var(--ember)}
.seg button.on.tardy{background:var(--gold);color:var(--ink)}
.seg button.on.left{background:#5B6B73;color:#fff}
.summary{display:flex;gap:10px;margin-top:14px}
.summary div{flex:1;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.summary div b{font-size:18px}
.summary .p{background:var(--leaf-soft);color:#0C5C5C}
.summary .t{background:var(--gold-soft);color:#6B4B0C}
.summary .a{background:var(--ember-soft);color:var(--ember)}
.summary .g{background:#E7EDEF;color:#4A5B63}

.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px 12px 18px;border-radius:12px;display:none;align-items:center;gap:14px;font-weight:600;font-size:15px;z-index:30;box-shadow:0 8px 30px rgba(31,46,54,.25);white-space:nowrap;pointer-events:none}
/* A full roster reaches the bottom of the screen, so the toast always sits
   over a student's tile. It stays where it is - that's where the eye goes -
   but it must not eat the tap meant for the name underneath it. Only Undo
   takes clicks. */
.toast button{pointer-events:auto}
.toast.show{display:flex}
.toast button{color:var(--gold);font-weight:800;padding:4px 6px}

.drawer{position:absolute;top:0;left:100%;bottom:0;width:380px;background:var(--card);border-left:1px solid var(--line);transition:left .2s ease;z-index:25;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(31,46,54,.15)}
.drawer.show{left:calc(100% - 380px)}
.drawer .dhead{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dhead h3{font-size:18px;font-weight:800}
.drawer .dbody{flex:1;overflow:auto;padding:16px 20px}
.drawer h4{font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 8px}
.drawer h4:first-child{margin-top:0}
.dbtn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:15px;margin-bottom:8px;background:var(--card)}
.dbtn small{display:block;font-weight:500;color:var(--mute);font-size:13px;margin-top:2px}
.dbtn.gold{background:var(--gold-soft);border-color:#E5C57E}
.dbtn.ember{background:var(--ember-soft);border-color:#E4B4A6;color:var(--ember)}
.dbtn.leaf{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.dbtn.leaf small{color:#CFE3F0}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.field small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.field select,.field input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--paper);font-size:14px;width:96px}
.leftday{display:block;width:100%;margin-top:14px;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;color:var(--mute)}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.rrow b{flex:1}
.rrow small{font-weight:500;color:var(--mute);font-size:12px}
.rrow button{font-size:13px;font-weight:700;color:var(--ember);padding:4px 6px}
.rrow button.back{color:var(--leaf)}
.rctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 22px 14px}
.rctl select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);font-size:14px;font-weight:700;color:var(--ink)}
.rnav{display:flex;align-items:center;gap:8px;margin-left:auto}
.rnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:800;color:var(--ink)}
.rnav b{font-size:14px;min-width:150px;text-align:center}
.chips{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.chip{flex:1;min-width:104px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--mute)}
.chip b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.02em;margin-top:2px}
.chip.warn{background:var(--ember-soft);border-color:#E4B4A6;color:var(--ember)}
.chip.warn b{color:var(--ember)}
.stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat>b{width:94px;font-weight:800}
.bar{flex:1;height:10px;border-radius:6px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.stat .v{width:172px;text-align:right;font-size:13px;font-weight:700;color:var(--mute)}
.stat .v em{font-style:normal;color:var(--ember)}
.two{display:flex;gap:6px}
.two select,.two input{max-width:104px}
.row .time.flag{color:var(--ember);font-weight:800}
.radd{display:flex;gap:8px;margin-top:12px}
.radd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-size:14px}
.radd button{background:var(--ink);color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;font-size:14px}
.setup{position:fixed;inset:0;background:var(--paper);display:none;place-items:center;z-index:80;padding:24px;overflow:auto}
.setup.show{display:grid}
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:580px;width:100%;padding:30px}
.setup-card h2{font-size:27px;letter-spacing:-.02em}
.setup-card .lede{color:var(--mute);font-size:15px;line-height:1.55;margin:9px 0 22px}
.setup-card label{display:block;font-weight:800;font-size:14px;margin-bottom:18px}
.setup-card input,.setup-card textarea{display:block;width:100%;margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;font-weight:600;background:var(--paper);resize:vertical;font-family:inherit}
.setup-card .hint{font-weight:600;color:var(--mute);font-size:13px;margin-top:7px}
.roster-list{margin:12px 0;border:1px solid var(--line);border-radius:12px;max-height:280px;overflow-y:auto;background:var(--paper)}
.roster-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.roster-item:last-child{border-bottom:none}
.roster-item button{color:var(--ember);font-weight:700;font-size:13px;padding:4px 8px}
.roster-add{display:flex;gap:8px}
.roster-add input{flex:1;min-width:0}
.setup-actions{display:flex;align-items:center;gap:12px}
.setup-actions span{color:var(--mute);font-size:14px;font-weight:700}
.setup-actions .btn{margin-left:auto}
.err{color:var(--ember);font-weight:700;font-size:14px;margin-top:12px;min-height:18px}
.tour{position:fixed;inset:0;background:rgba(31,46,54,.55);display:none;place-items:center;z-index:70;padding:24px}
.tour.show{display:grid}
.tour-card{background:var(--card);border-radius:20px;max-width:540px;width:100%;padding:28px}
.tour-card h3{font-size:22px;letter-spacing:-.01em}
.tour-card p{font-size:15px;line-height:1.6;color:var(--mute);margin-top:10px}
.tour-steps{display:flex;gap:6px;margin:20px 0 22px}
.tour-steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.tour-steps i.on{background:var(--leaf)}
.tour-actions{display:flex;gap:10px;align-items:center}
.tour-actions .skip{color:var(--mute);font-weight:700;font-size:14px;margin-right:auto}
.rcols{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.rpanes,.rside{display:contents}
.rh{font-size:13px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 4px}
.log{font-size:13px;color:var(--mute);line-height:1.5}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--ink)}
/* Landscape on a tablet leaves a sheet barely 500px tall, and the reports
   sheet spends most of that on its own title, tabs and big stat chips - the
   teacher was left scrolling a 70px window over 800px of report, or turning
   the tablet on its side to read it. Short screens have width to spare, so
   trade some: wider sheet, tighter chrome, and side-by-side panes - the
   controls and counts in a column on the left, the break categories on the
   right. The first try (content in two columns under a full-width row of
   controls and counts) still stacked everything above the categories, and at
   the real tablet's 840x528 the categories got 159px: three of five showed. */
@media (max-height:760px) and (min-width:820px){
  .sheet{max-width:1060px;padding:16px 20px 18px}
  .sheet h3{font-size:20px}
  .sheet p{font-size:14px;margin-top:2px}
  .sheet .x{width:38px;height:38px}
  .sheet .body{margin-top:10px}
  .actions{margin-top:12px}
  .rctl{padding-bottom:10px}
  .rnav b{min-width:120px}
  .chips{padding-bottom:10px;flex-wrap:nowrap;gap:8px}
  .chip{min-width:0;padding:7px 10px;font-size:11px}
  .chip b{font-size:17px;margin-top:0}
  .rpanes{display:grid;grid-template-columns:minmax(270px,34%) minmax(0,1fr);gap:0 20px;flex:1;min-height:0;margin-top:10px}
  .rside{display:flex;flex-direction:column;gap:6px;overflow:auto;min-height:0}
  .rside .rctl{flex-direction:column;align-items:stretch;flex-wrap:nowrap;padding:0;gap:5px}
  .rside .seg{display:flex}
  .rside .seg button{flex:1;text-align:center;padding:5px 8px}
  .rside .rctl select{width:100%;padding:5px 9px}
  .rside .rnav{margin-left:0;justify-content:space-between}
  .rside .rnav button{width:30px;height:30px}
  .rside .rnav b{min-width:0}
  .rside .chips{display:grid;grid-template-columns:1fr 1fr;padding:0;gap:5px}
  .rside .chip{padding:4px 9px}
  .rside .chip b{font-size:16px}
  /* the numbers beside each bar are what the teacher reads; the bar can shrink */
  .rpanes .stat .bar{min-width:40px}
  .rpanes .stat .v{width:232px}
  .rpanes>.body{margin-top:0}
  .rcols>div>.rh:first-child{margin-top:16px}
  .stat{padding:7px 0;font-size:13px}
  .stat>b{width:78px}
  .stat .v{width:168px;font-size:12px}
  .rowlist{gap:6px}
  .row{padding:7px 11px;gap:8px}
  .row b{font-size:14px}
  .row .time{min-width:0;font-size:12px}
}
/* ===== Narrow screens: a tablet held upright, or a small one either way =====
   Everything above was laid out for a wide landscape screen. None of these
   rules can reach a wide screen, so landscape stays exactly as it was. */
/* Header in two rows instead of one squeezed row: the class name and the
   buttons on top, the counts with the date and time beneath. On one row an
   upright tablet cut the name to "Hafiz Abdur Rafaye's ..." and dropped the
   date. fitHeader() decides - upright, or a name too long for one row - so it
   follows the teacher's name and screen rather than one fixed width.
   display:contents lets the two existing header blocks share one grid, so the
   markup (and the one-row layout built on it) stays exactly as it was. */
.top.stacked{display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"title btn menu" "stats when when";column-gap:10px;row-gap:8px;align-items:center;padding-top:12px;padding-bottom:12px}
.top.stacked .top-left,.top.stacked .top-right{display:contents}
.top.stacked h1{grid-area:title;font-size:clamp(19px,3.6vw,24px);white-space:normal;text-overflow:clip;overflow-wrap:anywhere;text-wrap:balance}
.top.stacked .start-btn{grid-area:btn}
.top.stacked .menu-btn{grid-area:menu}
.top.stacked .top-row2{grid-area:stats;flex-wrap:wrap;row-gap:5px;align-self:end}
.top.stacked .sub{flex:1 0 100%;white-space:normal;overflow:visible;text-overflow:clip;font-size:12px}
.top.stacked .when{grid-area:when;align-self:end}
@media (max-width:860px){
  /* These only take effect when something would otherwise not fit, so a
     screen where everything already fits looks exactly as before. */
  .banner{flex-wrap:wrap;row-gap:8px}
  .summary{flex-wrap:wrap}
  .summary div{white-space:nowrap;gap:8px}      /* wrap whole counts, never "Left / early" inside one */
}
@media (max-width:700px){
  /* List rows: name on its own line, the details beneath. As one line these
     ran off the right edge and the list scrolled sideways. */
  .row{flex-wrap:wrap;row-gap:4px}
  .row b{flex:1 1 60%;min-width:0}
  .row .time{min-width:0;text-align:left}
  .dsrow b{flex-basis:100%}
  .dsrow .time{flex:0 1 auto}
  .dsrow .time.flag{margin-left:auto}
  /* attendance: the four choices get their own full-width line */
  .atrow .seg{flex:1 0 100%;display:flex}
  .atrow .seg button{flex:1;text-align:center;padding-left:6px;padding-right:6px}
}
</style>

<body>

<div class="app booting">
  <header class="top">
    <div class="top-left">
      <h1 id="title">Hifz Class</h1>
      <div class="top-row2">
        <span class="pill">In class <b id="cIn">0</b></span>
        <span class="pill out">Out <b id="cOut">0</b></span>
        <span class="pill absent">Not here <b id="cAbs">0</b></span>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="top-right">
      <div class="when"><div class="date" id="date"></div><div class="clock" id="clock"></div></div>
      <button class="start-btn" id="mainBtn" onclick="mainAction()"></button>
      <button class="menu-btn" aria-label="Teacher menu" onclick="openDrawer()"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <main class="stage">
    <section class="panel">
      <div class="panel-head"><h2 id="gridTitle">Tap your name</h2><span class="hint" id="gridHint"></span></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Out right now</h2><span class="hint" id="outHint"></span></div>
      <div class="out-list" id="outList"></div>
    </section>
  </main>

  <div class="setup" id="setup"><div class="setup-card">
    <h2>Set up your class</h2>
    <p class="lede">Two things and you are ready. Everything stays on this computer &mdash; nothing is sent anywhere, and no account is needed.</p>
    <label>Your name
      <input id="tName" placeholder="e.g. Ustadh Bilal" oninput="setupCount()">
      <span class="hint">Shown in the corner as &ldquo;[your name]'s Hifz Class&rdquo;.</span>
    </label>
    <label>Your students
      <div class="roster-list" id="rosterList"></div>
      <div class="roster-add">
        <input id="tStudent" placeholder="Type a name and press Enter" onkeydown="if(event.key==='Enter')addSetupStudent()">
        <button class="btn ghost" onclick="addSetupStudent()">Add</button>
      </div>
      <span class="hint">Add them one by one. You can add or remove students anytime later.</span>
    </label>
    <div class="setup-actions"><span id="setupCount">0 students</span><button class="btn dark" onclick="finishSetup()">Create my class</button></div>
    <p class="err" id="setupErr"></p>
    <p class="hint" style="margin-top:14px">Already set up on another device? <a href="#" onclick="event.preventDefault();openJoinPrompt()" style="color:var(--leaf);font-weight:700">Enter your sync code</a> instead.</p>
  </div></div>
  <div class="tour" id="tour"><div class="tour-card" id="tourCard"></div></div>
  <input type="file" id="restoreInput" accept="application/json" style="display:none" onchange="restoreBackup(this)">
  <div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" onclick="undo()">Undo</button></div>
  <div class="scrim" id="drawerScrim" style="background:rgba(31,46,54,.25)" onclick="closeDrawer()"></div>
  <aside class="drawer" id="drawer">
    <div class="dhead"><h3>Teacher menu</h3><button class="menu-btn" style="margin-left:auto;background:var(--paper)" onclick="closeDrawer()"><svg viewBox="0 0 24 24" style="stroke:var(--ink)"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="dbody" id="dbody"></div>
  </aside>
</div>

<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>
<script>
/*BUILD_STAMP*/const APP_VERSION="1.0.0",APP_BUILD="3d6287a0bf",APP_BUILD_TIME="2026-09-23T09:36:25.308Z";
const REASONS=[
  {key:'washroom',label:'Washroom',icon:'<svg viewBox="0 0 24 24"><path d="M5 12h14v3a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5v-3zM7 12V6a2 2 0 0 1 4 0v1"/></svg>'},
  {key:'water',label:'Water',icon:'<svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>'},
  {key:'wudhu',label:'Wudhu',icon:'<svg viewBox="0 0 24 24"><path d="M12 3s3.5 4.4 3.5 6.6a3.5 3.5 0 0 1-7 0C8.5 7.4 12 3 12 3z"/><path d="M3.5 15c2.2 3.3 5.3 5 8.5 5s6.3-1.7 8.5-5"/></svg>'},
  {key:'other',label:'Other',icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/></svg>'},
  {key:'assigned',label:'Assigned',icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 13V9M9.5 2.5h5M19.5 5.5 21 7"/></svg>'}
];
const state={
  teacher:'', setup:false,
  students:[],
  settings:{
    startTime:'08:00', endTime:'15:30',
    snack:{start:'10:10',end:'10:20'}, lunch:{start:'12:05',end:'14:05'},
    longMin:10,                                   // fallback alert for Other
    limits:{washroom:{min:7,trips:2}, water:{min:1,trips:2}, wudhu:{min:2,trips:2}}
  },
  session:{status:'preclass',startedAt:null,endedAt:null,lunchAt:null,pauseLabel:null,resumeAt:null}, // preclass | live | paused | ended
  // attendance: sid -> {status:'present'|'absent'|'tardy', at:Date|null, note}
  // Everyone is assumed present. Pre-class tap = deactivate (absent). Post-start tap on deactivated = tardy, time noted.
  attendance:{}, active:{}, breaks:[], log:[], lastAction:null
};
state.students.forEach(s=>state.attendance[s.id]={status:'present',at:null,note:''});

const $=id=>document.getElementById(id);
const clockStr=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dateStr=d=>d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric',year:'numeric'});
const pad=n=>String(n).padStart(2,'0');
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${pad(s%60)}`};
const nameOf=sid=>(state.students.find(s=>s.id===sid)||{}).name||'';
const roster=()=>state.students.filter(s=>s.active);            // kept in the teacher's roll order
const RSN=k=>REASONS.find(r=>r.key===k)||{key:k,label:k};
const LIMIT=k=>state.settings.limits[k]||null;
const capMs=(k,assignedMin)=>(k==='assigned'||k==='other')?Math.max(1,assignedMin||0)*60000:(LIMIT(k)?LIMIT(k).min*60000:state.settings.longMin*60000);
const tripsUsed=(sid,k)=>state.breaks.filter(b=>b.sid===sid&&b.reason===k).length+(((state.active[sid]||{}).reason===k)?1:0);
const flagsOf=sid=>state.breaks.filter(b=>b.sid===sid&&b.flag).length;
const isLong=a=>!!a.allowMs&&Date.now()-a.startAt>a.allowMs;
const toMin=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hm=t=>{const[h,m]=String(t).split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return clockStr(d)};
function dueBreak(){
  const S=state.settings,n=nowMin();
  if(n>=toMin(S.snack.start)&&n<toMin(S.snack.end)) return {kind:'Snack break',start:S.snack.start,end:S.snack.end};
  if(n>=toMin(S.lunch.start)&&n<toMin(S.lunch.end)) return {kind:'Lunch and recess',start:S.lunch.start,end:S.lunch.end};
  return null;
}
function nextUp(){
  const S=state.settings,n=nowMin();
  const items=[[toMin(S.snack.start),'snack '+hm(S.snack.start)],[toMin(S.lunch.start),'lunch '+hm(S.lunch.start)],[toMin(S.endTime),'ends '+hm(S.endTime)]];
  const nx=items.find(i=>i[0]>n); return nx?nx[1]:'';
}
const att=sid=>state.attendance[sid];
const st=()=>state.session.status;
function logIt(msg){ state.log.unshift({t:new Date(),msg}); }

/* ===== durable storage: localStorage on the web, native SharedPreferences on
   Android via @capacitor/preferences (survives WebView data clears - plain
   localStorage does not reliably on native, which is what caused "loses my
   data when the app shuts down"). Reads are synchronous off an in-memory
   cache hydrated once at boot; writes are fire-and-forget, same best-effort
   spirit as the try/catch localStorage calls this file already used. ===== */
const Store=(function(){
  const native=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences);
  const Prefs=native?window.Capacitor.Plugins.Preferences:null;
  const cache={};
  async function hydrate(keys){
    await Promise.all(keys.map(async k=>{
      if(native){
        try{
          const r=await Prefs.get({key:k});
          if(r&&r.value!=null){ cache[k]=r.value; return; }
        }catch(e){}
        // Preferences has nothing for this key. Before this device ever had
        // the Preferences plugin (pre-Phase-1 native builds), everything was
        // written straight to the WebView's own localStorage - that data is
        // still sitting there, just invisible to Prefs.get(). Fall back to
        // it, and promote it into Preferences once so it's durable from here
        // on. Never delete the localStorage copy - it's harmless once
        // promoted, and it's exactly the kind of local safety net the rest
        // of this app relies on (see the "legacy local keys" note below).
        let fallback=null;
        try{ fallback=localStorage.getItem(k); }catch(e){}
        cache[k]=fallback;
        if(fallback!=null){ try{ await Prefs.set({key:k,value:fallback}); }catch(e){} }
        return;
      }
      try{ cache[k]=localStorage.getItem(k); }catch(e){ cache[k]=null; }
    }));
  }
  function get(key){ return Object.prototype.hasOwnProperty.call(cache,key) ? cache[key] : (()=>{ try{ return localStorage.getItem(key); }catch(e){ return null; } })(); }
  function set(key,value){
    cache[key]=value;
    if(native){ Prefs.set({key,value}).catch(()=>{}); return; }
    try{ localStorage.setItem(key,value); }catch(e){}
  }
  function remove(key){
    cache[key]=null;
    if(native){ Prefs.remove({key}).catch(()=>{}); return; }
    try{ localStorage.removeItem(key); }catch(e){}
  }
  return {hydrate,get,set,remove,native};
})();

/* ===== legacy local keys - read-only from here on =====
   Firestore is now the source of truth (IMPLEMENTATION_PLAN.md 2.1); these
   two keys are never written again, only read once at boot as a same-day
   fallback so an install that hasn't been online since upgrading still
   opens straight into its existing class instead of a blank setup screen
   (see bootstrapOrgFromLocal()). Kept for one release as a safety net, per
   plan section 4/9 - do not delete them here. */
const KEY='hifz.guest.day', PKEY='hifz.guest.profile', todayKey=()=>new Date().toDateString();
function mergeSettings(x){
  const def=state.settings, out=Object.assign({},def,x||{});
  out.limits=Object.assign({},def.limits,(x||{}).limits||{});
  out.snack=Object.assign({},def.snack,(x||{}).snack||{});
  out.lunch=Object.assign({},def.lunch,(x||{}).lunch||{});
  return out;
}
function ensureAttendance(){ state.students.forEach(x=>{ if(!state.attendance[x.id]) state.attendance[x.id]={status:'present',at:null,note:''}; }); }
function loadProfile(){
  try{
    const o=JSON.parse(Store.get(PKEY)||'null'); if(!o) return;
    if(Array.isArray(o.students)&&o.students.length) state.students=o.students;
    if(o.teacher) state.teacher=o.teacher;
    state.settings=mergeSettings(o.settings); ensureAttendance();
    // a saved roster means setup already happened, even on data saved before `setup` itself was persisted
    if(o.setup||(Array.isArray(state.students)&&state.students.length)) state.setup=true;
  }catch(e){}
}
function load(){
  try{
    const raw=Store.get(KEY); if(!raw) return;
    const o=JSON.parse(raw); if(!o||o.day!==todayKey()) return;
    const d=v=>v?new Date(v):null, s=o.state;
    s.session.startedAt=d(s.session.startedAt); s.session.endedAt=d(s.session.endedAt); s.session.lunchAt=d(s.session.lunchAt);
    Object.values(s.attendance).forEach(a=>a.at=d(a.at));
    Object.values(s.active).forEach(a=>a.startAt=d(a.startAt));
    s.breaks.forEach(b=>{b.startAt=d(b.startAt); b.endAt=d(b.endAt);});
    s.log.forEach(l=>l.t=d(l.t));
    s.settings=mergeSettings(s.settings);                       // settings shape may have grown since the save
    s.lastAction=null;
    delete s.setup; delete s.teacher;                           // profile fields - loadProfile() already set these, don't let a stale same-day snapshot revert them
    Object.assign(state,s); ensureAttendance();
  }catch(e){}
}

/* ===== Firestore: the source of truth (IMPLEMENTATION_PLAN.md section 2) =====
   Personal accounts are organizations of one (2.2) - there is no Google
   Sign-In yet (that's Phase 4/2.8), so auth stays anonymous and the org's
   random id plays the role the old "class code" did: knowing it is what
   "having access" means (see firestore.rules). A second device "joins" by
   writing its own membership doc for that org id - same trust boundary as
   before, now a real record instead of an implicit one.

   Offline persistence (enablePersistence) means normal use never talks to
   the network directly - reads come from the local cache and writes queue
   and flush on reconnect automatically. That, plus every mutation below
   going through a named writer instead of a blanket save(), is what "source
   of truth" means day to day: there is exactly one place this data lives,
   and this device's copy of it is a cache, not a second original. */
const FIREBASE_CONFIG={
  projectId:"hifz-class-tracker-dece7",
  appId:"1:726082000637:web:c4bc54fd73d8853f44d094",
  storageBucket:"hifz-class-tracker-dece7.firebasestorage.app",
  apiKey:"AIzaSyAZS_OEMnmcvc5xDzNESMVBvXJ4oGWCUBo",
  authDomain:"hifz-class-tracker-dece7.firebaseapp.com",
  messagingSenderId:"726082000637"
};
const CLASS_ID='default';                       // one class per personal org - Phase 2 scope
const SESSION_ORG_KEY='session.orgId', SESSION_CLASS_KEY='session.classId', CACHE_KEY='cache.lastClass';
const dayId=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const DEFAULT_FLAG_THRESHOLD=2;                  // org.defaults.flagThreshold - only consumed by the Phase 5 admin dashboard, stored now so the schema doesn't need a later migration
let fbApp=null, fbDb=null, fbUid=null, fbReady=null;
let ORG_ID=null, TODAY_ID=null, syncStatus='offline';   // offline | connecting | synced | error
/* Which calendar day the session/attendance/breaks currently in memory belong
   to. A day's state must never outlive its day: the instant-paint cache has no
   server round-trip to correct it, so without this the app reopens the next
   morning still showing yesterday's ended class and yesterday's absent/tardy
   marks. Set wherever day state is established; checked every tick. */
let DAY_STATE_ID=null;
let unsubOrg=null, unsubClass=null, unsubStudents=null, unsubDay=null, unsubBreaks=null;

/* Test hook only (tests/write-count.spec.mjs): every real Firestore write
   funnels through fsWrite() so a test can assert "zero writes while idle"
   by diffing this counter, without needing to intercept network traffic. */
window.__hifzWriteCount=0;
function fsWrite(p){ window.__hifzWriteCount++; return p; }
Object.defineProperty(window,'__hifzOrgId',{get:()=>ORG_ID});
Object.defineProperty(window,'__hifzSyncStatus',{get:()=>syncStatus});

function genSyncCode(){
  const abc='ABCDEFGHJKMNPQRSTUVWXYZ23456789';                // no 0/O/1/I/L look-alikes
  let s=''; for(let i=0;i<10;i++) s+=abc[Math.floor(Math.random()*abc.length)];
  return s.match(/.{1,5}/g).join('-');
}
function syncStatusLabel(){
  return syncStatus==='synced'?'Synced — changes appear on other devices within seconds'
    :syncStatus==='connecting'?'Connecting…'
    :syncStatus==='error'?'Offline — saved on this device, will sync once you\'re back online'
    :'Not synced yet';
}
function academicYearId(d){ const y=d.getFullYear(); return d.getMonth()>=7?`${y}-${y+1}`:`${y-1}-${y}`; }
function settingsToDefaults(s){ return {startTime:s.startTime,endTime:s.endTime,snack:s.snack,lunch:s.lunch,longMin:s.longMin,limits:s.limits,flagThreshold:DEFAULT_FLAG_THRESHOLD}; }
function sessionToPlain(s){ return {status:s.status,startedAt:s.startedAt?+s.startedAt:null,endedAt:s.endedAt?+s.endedAt:null,lunchAt:s.lunchAt?+s.lunchAt:null,pauseLabel:s.pauseLabel||null,resumeAt:s.resumeAt||null}; }
function plainToSession(p){ const d=v=>v?new Date(v):null; return {status:p.status||'preclass',startedAt:d(p.startedAt),endedAt:d(p.endedAt),lunchAt:d(p.lunchAt),pauseLabel:p.pauseLabel||null,resumeAt:p.resumeAt||null}; }
function plainToAttendance(p){ const out={}; Object.entries(p||{}).forEach(([sid,a])=>{ out[sid]={status:a.status||'present',at:a.at?new Date(a.at):null,note:a.note||''}; }); return out; }
function fullAttendancePlain(){ const out={}; state.students.forEach(s=>{ const a=state.attendance[s.id]||{status:'present',at:null,note:''}; out[s.id]={status:a.status,at:a.at?+a.at:null,note:a.note||''}; }); return out; }
function fullRosterPlain(){ return Object.fromEntries(state.students.map(s=>[s.id,s.name])); }

function initFirestore(){
  if(fbReady) return fbReady;
  fbReady=(async()=>{
    try{
      fbApp=firebase.initializeApp(FIREBASE_CONFIG);
      fbDb=firebase.firestore(fbApp);
      const params=new URLSearchParams(location.search);
      if(params.get('emulator')){                         // test-only: point at local emulators, never used in production builds
        fbDb.useEmulator('127.0.0.1',8080);
        firebase.auth(fbApp).useEmulator('http://127.0.0.1:9099',{disableWarnings:true});
      }
      try{ await fbDb.enablePersistence({synchronizeTabs:true}); }
      catch(e){ /* failed-precondition (another tab) or unimplemented (old browser) - keep going without persistence, per plan 2.1 */ }
      await firebase.auth(fbApp).setPersistence(firebase.auth.Auth.Persistence.LOCAL);
      const cred=await firebase.auth(fbApp).signInAnonymously();
      fbUid=cred.user.uid;
      return true;
    }catch(e){ return false; }
  })();
  return fbReady;
}

function orgRefFor(code){ return fbDb.collection('orgs').doc(code); }
function orgRef(){ return orgRefFor(ORG_ID); }
function classRef(){ return orgRef().collection('classes').doc(CLASS_ID); }
function dayRef(id){ return classRef().collection('days').doc(id||TODAY_ID); }

/* One-time creation of a brand-new personal org from whatever is currently
   in `state` (either just-entered setup, or an existing local class being
   upgraded - see bootstrapOrgFromLocal()). Fire-and-forget from the caller:
   the UI is already updated optimistically before this resolves. */
async function bootstrapOrg(){
  syncStatus='connecting'; render();
  const ok=await initFirestore();
  if(!ok){ syncStatus='error'; render(); scheduleBootstrapRetry(); return false; }
  try{
    const code=genSyncCode(), now=firebase.firestore.FieldValue.serverTimestamp();
    const org=orgRefFor(code);
    await fsWrite(org.set({
      schemaVersion:3, name:`${state.teacher||'My'}'s Hifz Class`, kind:'personal',
      activeYearId:academicYearId(new Date()), defaults:settingsToDefaults(state.settings),
      createdAt:now, updatedAt:now
    }));
    await fsWrite(org.collection('members').doc(fbUid).set({
      email:'', displayName:state.teacher||'', roles:['admin','teacher'], status:'active', joinedAt:now
    }));
    await fsWrite(org.collection('classes').doc(CLASS_ID).set({
      name:`${state.teacher||'My'}'s Hifz Class`, teacherUid:fbUid, settingsOverride:null, status:'active'
    }));
    await Promise.all(state.students.map((s,i)=>fsWrite(
      org.collection('classes').doc(CLASS_ID).collection('students').doc(s.id).set({
        name:s.name, active:!!s.active, order:i, enrolledFrom:dayId(new Date()), enrolledUntil:null
      })
    )));
    await fsWrite(org.collection('classes').doc(CLASS_ID).collection('days').doc(dayId(new Date())).set({
      date:dayId(new Date()), yearId:academicYearId(new Date()),
      session:sessionToPlain(state.session), attendance:fullAttendancePlain(), roster:fullRosterPlain(),
      updatedAt:now
    },{merge:true}));
    ORG_ID=code; Store.set(SESSION_ORG_KEY,code); Store.set(SESSION_CLASS_KEY,CLASS_ID);
    sendHeld();
    await attachListeners();
    return true;
  }catch(e){ syncStatus='error'; render(); scheduleBootstrapRetry(); return false; }
}
/* Covers the one edge case Firebase Auth itself can't queue offline: a
   brand-new install's very first anonymous sign-in needs one network round
   trip. If that fails, the class still works locally (state is already
   updated) and this retries quietly once connectivity returns. */
function scheduleBootstrapRetry(){
  if(scheduleBootstrapRetry._armed) return;
  scheduleBootstrapRetry._armed=true;
  window.addEventListener('online',function once(){
    window.removeEventListener('online',once); scheduleBootstrapRetry._armed=false;
    if(!ORG_ID && state.setup) bootstrapOrg();
  });
}
/* Phase 2 minimal migration: an install upgrading from before this version
   has a class in the legacy local keys but no org yet. Upload it once, same
   codepath as a fresh setup. Full day-archive migration is Phase 3. */
function bootstrapOrgFromLocal(){ bootstrapOrg(); }

async function joinByCode(code){
  code=(code||'').trim().toUpperCase();
  if(!code) return toast('Type a sync code first.');
  syncStatus='connecting';
  const ok=await initFirestore();
  if(!ok){ syncStatus='error'; return toast('Could not connect. Check your internet and try again.'); }
  try{
    const snap=await orgRefFor(code).get();
    if(!snap.exists){ syncStatus='error'; return toast('No class found with that code.'); }
    const now=firebase.firestore.FieldValue.serverTimestamp();
    await fsWrite(orgRefFor(code).collection('members').doc(fbUid).set({
      email:'', displayName:'', roles:['admin','teacher'], status:'active', joinedAt:now
    }));
    held=[];                                    // anything unsent belonged to this device's previous class, never the one being joined
    ORG_ID=code; Store.set(SESSION_ORG_KEY,code); Store.set(SESSION_CLASS_KEY,CLASS_ID);
    await attachListeners();
    state.setup=true; closeSheet(); $('setup').classList.remove('show'); render();
    toast('Class loaded — this device will stay in sync.');
  }catch(e){ syncStatus='error'; toast('Could not join with that code.'); }
}

function detachListeners(){ [unsubOrg,unsubClass,unsubStudents,unsubDay,unsubBreaks].forEach(u=>u&&u()); unsubOrg=unsubClass=unsubStudents=unsubDay=unsubBreaks=null; }
async function attachToOrg(orgId){
  syncStatus='connecting'; render();
  const ok=await initFirestore();
  if(!ok){
    // offline on boot: keep whatever the local cache painted and retry once
    // back online - do NOT fall back to setup just because we can't reach
    // the network yet (plan 2.1: the app must keep working offline).
    ORG_ID=orgId; syncStatus='error'; render(); scheduleBootstrapRetry(); return;
  }
  try{
    const snap=await orgRefFor(orgId).get();
    if(!snap.exists){
      // a genuinely stale/deleted org id - this is the "never crash" case
      // from plan 2.9, not the offline case above.
      Store.remove(SESSION_ORG_KEY); Store.remove(SESSION_CLASS_KEY); Store.remove(CACHE_KEY);
      syncStatus='offline'; return openSetup();
    }
  }catch(e){
    // couldn't verify existence (e.g. offline-but-not-yet-cached) - assume
    // it's still good and let the realtime listeners recover once connected.
  }
  ORG_ID=orgId;
  sendHeld();
  await attachListeners();
}
async function attachListeners(){
  detachListeners();
  const org=orgRef(), cls=classRef();
  // Every data listener below takes includeMetadataChanges - see the note on
  // the breaks listener for why. In short: an answer the cloud computed for an
  // earlier change can arrive just after a newer change was made on screen,
  // without it, and overwrite it. Hearing each confirmation means the newer
  // change is put back a moment later, instead of staying wrong on screen.
  unsubOrg=org.onSnapshot({includeMetadataChanges:true},snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites) return;
    const d=snap.data(); if(d.defaults) state.settings=mergeSettings(d.defaults);
    render();
  },()=>{ syncStatus='error'; render(); });
  unsubClass=cls.onSnapshot(snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites) return;
    render();
  },()=>{});
  unsubStudents=cls.collection('students').onSnapshot({includeMetadataChanges:true},qs=>{
    if(qs.metadata.hasPendingWrites) return;
    const list=[]; qs.forEach(doc=>list.push(Object.assign({id:doc.id},doc.data())));
    list.sort((a,b)=>(a.order||0)-(b.order||0));
    state.students=list.map(s=>({id:s.id,name:s.name,active:s.active!==false}));
    ensureAttendance(); render();
  },()=>{});
  attachDayListeners();
  syncStatus='synced'; render();
  migrateLegacyHistoryIfNeeded();
}
function attachDayListeners(){
  if(unsubDay) unsubDay(); if(unsubBreaks) unsubBreaks();
  TODAY_ID=dayId(new Date());
  const d=dayRef(TODAY_ID);
  unsubDay=d.onSnapshot({includeMetadataChanges:true},snap=>{
    if(snap.metadata.hasPendingWrites||inflight.day) return;          // see "the screen only moves forward"
    applyDay(snap);
  },()=>{});
  // includeMetadataChanges: also hear the moment this device's own changes are
  // confirmed. Answers carrying unconfirmed changes are skipped below, and a
  // confirmation that changes no data raises no event by default - so if the
  // last answer processed was an in-between one, the screen stayed on it.
  // Two ways one gets through: an answer computed before a newer change was
  // made, delivered just after it (the newer change isn't in it, so nothing in
  // it is "pending"); and a delete, whose break leaves the list and so never
  // counts as pending - deleting a break could leave a later trip showing
  // "past daily limit" here while the record said otherwise.
  unsubBreaks=d.collection('breaks').onSnapshot({includeMetadataChanges:true},qs=>{
    if(qs.metadata.hasPendingWrites||inflight.breaks) return;
    applyBreaks(qs);
  },()=>{});
}
function applyDay(snap){
  if(!snap.exists){
    // Nothing recorded today, so anything on screen came from an older day.
    // Only trust this from the server: offline, "missing" just means we have
    // not heard back yet, and wiping a real in-progress day would be worse.
    if(!snap.metadata.fromCache && dayStateIsDirty()){ resetLocalDayState(); render(); }
    return;
  }
  const data=snap.data();
  if(data.session) state.session=plainToSession(data.session);
  if(data.attendance) state.attendance=plainToAttendance(data.attendance);
  ensureAttendance(); render();
}
function applyBreaks(qs){
  const active={}, done=[];
  qs.forEach(doc=>{
    const b=doc.data(), r=RSN(b.reason);
    if(b.endAt==null){ active[b.sid]={reason:b.reason,label:r.label,startAt:new Date(b.startAt),note:'',allowMs:b.allowMs||0,assignedMin:b.assignedMin||null,overTrip:!!b.overTrip,_id:doc.id}; }
    else{ done.push({sid:b.sid,reason:b.reason,label:r.label,startAt:new Date(b.startAt),endAt:new Date(b.endAt),dur:b.dur,allowMs:b.allowMs||0,assignedMin:b.assignedMin||null,over:b.over||0,overTrip:!!b.overTrip,flag:!!b.flag,note:'',_id:doc.id}); }
  });
  done.sort((a,b)=>a.startAt-b.startAt);
  state.active=active; state.breaks=done; render();
}
/* ===== the screen only moves forward =====
   An answer from a listener is worked out at one moment and handed over a
   moment later. Its hasPendingWrites says whether this device's unconfirmed
   changes were in it when it was worked out - not whether a newer change was
   made before it arrived. So an answer worked out just before a tap, handed
   over just after, carries no pending flag, and put the screen back to before
   the tap. In testing: "Start class", then a stale answer saying class hadn't
   started, so the next tap on a student marked them "not here" instead of
   opening their break sheet - a wrong absence in the record.
   inflight counts this device's own unconfirmed writes to each record. While
   any are unconfirmed, answers for that record are ignored: the screen already
   shows the change, and no answer can be newer than it. When the last is
   confirmed (or refused), resync() reads the settled copy from the local
   cache once, so another device's change that arrived meanwhile isn't missed
   and a refused write can't leave the screen showing something unsaved. */
const inflight={day:0,breaks:0};
function tracked(kind,p){
  inflight[kind]++;
  const settle=()=>{ if(--inflight[kind]===0) resync(kind); };
  p.then(settle,settle);
  return p;
}
function resync(kind){
  if(!ORG_ID||!TODAY_ID||!fbDb) return;
  const ref=kind==='day'?dayRef():dayRef().collection('breaks');
  ref.get({source:'cache'}).then(s=>{
    if(inflight[kind]||s.metadata.hasPendingWrites) return;
    (kind==='day'?applyDay:applyBreaks)(s);
  }).catch(()=>{});
}

/* ===== changes made before the connection is ready are held, not dropped =====
   The class's cloud id (ORG_ID) is only known after sign-in plus a server
   round trip - on EVERY app open, and for several round trips when a class is
   first created. Every writer used to start `if(!ORG_ID) return;`, so a tap in
   that window changed the screen and was never saved. Worse, the listeners
   then attached, read the cloud's version (which never got the change) and
   replaced the screen with it: the break vanished from both. On weak
   classroom wifi that window is seconds.
   Now each writer packages its change at the moment of the tap and hands it to
   send(). Connected: it goes straight out. Not yet: it waits in `held`, and
   sendHeld() releases everything in tap order the moment the id is known -
   before the listeners attach, so their first answer already includes it.
   Waiting for fbUid too means nothing is ever sent without a signed-in user,
   which the rules would reject. */
let held=[];
function send(commit){ if(ORG_ID&&fbUid) return commit(); held.push(commit); }
function sendHeld(){
  if(!ORG_ID||!fbUid||!held.length) return;
  TODAY_ID=TODAY_ID||dayId(new Date());                     // writers address today's doc through it
  const q=held; held=[];
  q.forEach(commit=>{ try{ commit(); }catch(e){} });
}

/* ===== writers: the only functions allowed to touch Firestore =====
   Each maps to one real user action (plan 2.4). Discrete events (attendance,
   break start/stop, session changes, roster edits) write immediately.
   Settings debounce ~700ms since a teacher taps through several fields in a
   row. Never called from render() or tick(). */
function writeSettings(){
  clearTimeout(writeSettings._t);
  writeSettings._t=setTimeout(()=>{
    const defaults=settingsToDefaults(state.settings);
    send(()=>fsWrite(orgRef().set({defaults,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})).catch(()=>{}));
  },700);
}
function writeRosterStudent(s){
  const order=Math.max(0,state.students.findIndex(x=>x.id===s.id));
  const doc={name:s.name, active:!!s.active, order, enrolledFrom:dayId(new Date()), enrolledUntil:null};
  send(()=>fsWrite(classRef().collection('students').doc(s.id).set(doc,{merge:true})).catch(()=>{}));
}
function writeDay(patch){
  const yearId=academicYearId(new Date());
  send(()=>tracked('day',fsWrite(dayRef().set(Object.assign({date:TODAY_ID,yearId,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},patch),{merge:true}))).catch(()=>{}));
}
function writeSessionAndAttendance(){ writeDay({session:sessionToPlain(state.session),attendance:fullAttendancePlain(),roster:fullRosterPlain()}); }
function writeAttendance(sid){
  const a=state.attendance[sid];
  writeDay({attendance:{[sid]:{status:a.status,at:a.at?+a.at:null,note:a.note||''}},roster:{[sid]:nameOf(sid)}});
}
function breakDocId(sid,startAt){ return `${sid}_${+startAt}`; }
function writeBreakStart(sid){
  const a=state.active[sid]; if(!a) return;
  // The id is fixed from the start time, so it is known at the tap even when
  // offline - a cancel or end held behind this start addresses the same doc.
  const id=a._id||breakDocId(sid,a.startAt); a._id=id;    // keep the original id if the start time was corrected since
  const doc={sid, reason:a.reason, startAt:+a.startAt, endAt:null, dur:null, over:null, flag:null,
    overTrip:!!a.overTrip, assignedMin:a.assignedMin||null};
  send(()=>tracked('breaks',fsWrite(dayRef().collection('breaks').doc(id).set(doc))).catch(()=>{}));
}
function writeBreakEnd(rec){
  const id=rec._id||breakDocId(rec.sid,rec.startAt);
  const doc={sid:rec.sid, reason:rec.reason, startAt:+rec.startAt, endAt:+rec.endAt, dur:rec.dur,
    over:rec.over||0, flag:!!rec.flag, overTrip:!!rec.overTrip, assignedMin:rec.assignedMin||null};
  send(()=>tracked('breaks',fsWrite(dayRef().collection('breaks').doc(id).set(doc))).catch(()=>{}));
}
function writeBreakCancel(id){
  if(!id) return;
  send(()=>tracked('breaks',fsWrite(dayRef().collection('breaks').doc(id).delete())).catch(()=>{}));
}
/* One batch, so the cloud's answer is all-or-nothing: separate deletes each
   raise their own in-between answer, and a list of breaks shrinking one at a
   time on screen is exactly the flicker the listeners have to smooth over. */
function writeBreakCancelAll(ids){
  if(!ids.length) return;
  send(()=>{ const b=fbDb.batch(); ids.forEach(id=>b.delete(dayRef().collection('breaks').doc(id))); return tracked('breaks',fsWrite(b.commit())).catch(()=>{}); });
}

/* ===== legacy local-history migration (Phase 3, plan section 4) =====
   Every device that ever ran this app pre-Firestore (or ran Phase 2, which
   still wrote local history alongside the day docs) has its own
   `hifz.tracker.history` (HKEY) of days that may or may not already be in
   Firestore - written by this same device before it had an org, or by a
   completely different device. Two devices can hold DIFFERENT subsets.

   The rule: Firestore's day doc for a date, if one already exists, always
   wins - this device's local copy of that same date is left untouched (it
   is never deleted, so nothing is lost even if it's skipped). Only dates
   Firestore doesn't have yet get uploaded. That is what makes this a merge
   instead of a replace, and safe to run from any number of devices in any
   order. A transaction closes the one real race (two devices migrating the
   same missing date at the same moment) by making "check, then write"
   atomic per day.

   Runs once per device (MIGRATION_FLAG_KEY guards it), after this device
   has real listeners attached to an org - never blocks boot, never retries
   in a tight loop, and never touches HKEY itself (read-only forever after,
   same as PKEY/KEY - see the "legacy local keys" note near the top).

   The ".v2" is deliberate, not decoration: the first shipped version of this
   flag was missing from boot()'s Store.hydrate() list, so on native it was
   read via Store.get()'s raw-localStorage fallback (always empty, since
   set() on native writes to Preferences, not localStorage) while being
   *written* to Preferences successfully. Combined with the hydrate() bug
   above - which made HKEY itself read as empty on native - affected devices
   already durably recorded "done" in Preferences against a wrongly-empty
   history. Fixing hydrate() alone would make that stale done-flag readable
   again and permanently skip the real migration. The new key name forces
   every existing install to run this once more, now that both bugs are
   fixed and HKEY is actually visible. Do not rename it again without the
   same reasoning - each rename is a one-time "everyone re-migrates" event. */
const MIGRATION_FLAG_KEY='migration.legacyHistoryDone.v2';
const MIGRATION_FAILURES_KEY='migration.failures';
window.__hifzMigrationDone=false;
/* Each day is its own try/catch - a bug or a transient failure on one date
   must never take the rest of the archive down with it (the original bug:
   one throw inside the loop hit the OUTER try/catch, which aborted every
   day after it and left the flag unset, so the very next boot walked into
   the exact same failing day first and aborted again - the run could never
   get past it). Failures are recorded (date + message), not swallowed, and
   the global flag is only ever set to done when EVERY day succeeded, so a
   run with failures naturally retries on the next boot - already-migrated
   days are cheap no-ops (mergeDayIntoFirestoreIfMissing's existence check
   skips them immediately), so this is safe to repeat. */
async function migrateLegacyHistoryIfNeeded(){
  if(Store.get(MIGRATION_FLAG_KEY)==='1'||!ORG_ID){ window.__hifzMigrationDone=true; return; }
  const h=readHistory();
  const failures={};
  for(const id of Object.keys(h)){
    try{ await mergeDayIntoFirestoreIfMissing(id,h[id]); }
    catch(e){ failures[id]=String((e&&e.message)||e); }
  }
  Store.set(MIGRATION_FAILURES_KEY,JSON.stringify(failures));
  if(Object.keys(failures).length===0) Store.set(MIGRATION_FLAG_KEY,'1');
  window.__hifzMigrationDone=true;
}
/* Shared by migration above and restoreBackup() below - both are "I have a
   day snapshot from somewhere else, make sure Firestore has it" and both
   need the same non-destructive rule: an existing Firestore day always
   wins, never overwritten. */
async function mergeDayIntoFirestoreIfMissing(id,snap){
  const dRef=classRef().collection('days').doc(id);
  await fbDb.runTransaction(async tx=>{
    const existing=await tx.get(dRef);
    if(existing.exists) return;                          // Firestore already has this date - never overwrite it
    const dateObj=new Date(id+'T00:00:00');
    tx.set(dRef,{
      date:id, yearId:academicYearId(dateObj),
      session:{status:'ended',startedAt:snap.startedAt||null,endedAt:snap.endedAt||null,lunchAt:null,pauseLabel:null,resumeAt:null},
      attendance:Object.fromEntries(Object.entries(snap.att||{}).map(([sid,a])=>[sid,{status:a.status,at:null,note:a.note||''}])),
      roster:snap.names||{},
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    (snap.breaks||[]).forEach((b,i)=>{
      tx.set(dRef.collection('breaks').doc('legacy'+i),{
        sid:b.sid, reason:b.reason, startAt:null, endAt:null, dur:b.dur||0,
        over:b.over||0, flag:!!b.flag, overTrip:!!b.overTrip, assignedMin:b.assignedMin||null
      });
    });
  });
}

/* Test-only (tests/*.spec.mjs): writes a day doc + its breaks directly,
   simulating "another device already recorded this day via normal Phase 2
   use" - exercises the real writer path and real rules, never used by any
   production UI. */
window.__hifzTestSeedDay=async function(id,attendance,breaksArr){
  if(!ORG_ID) return false;
  const ref=dayRef(id);
  await ref.set({
    date:id, yearId:academicYearId(new Date(id+'T00:00:00')),
    session:{status:'ended',startedAt:null,endedAt:null,lunchAt:null,pauseLabel:null,resumeAt:null},
    attendance:attendance||{}, roster:fullRosterPlain(), updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  });
  await Promise.all((breaksArr||[]).map((b,i)=>ref.collection('breaks').doc('seed'+i).set(b)));
  return true;
};
window.__hifzTestReadDay=async function(id){
  if(!ORG_ID) return null;
  const snap=await dayRef(id).get();
  if(!snap.exists) return null;
  const breaksQs=await dayRef(id).collection('breaks').get();
  return {data:snap.data(), breaks:breaksQs.docs.map(d=>d.data())};
};
