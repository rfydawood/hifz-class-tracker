<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hifz Class Tracker</title>
<meta name="description" content="Classroom attendance and break tracker for hifz teachers. Works offline, data stays on this device.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2E36">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hifz Tracker">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F2E36; --leaf:#0F7B7B; --leaf-soft:#DCEDED;
  --gold:#D39A22; --gold-soft:#FBF0D8; --ember:#C0503A; --ember-soft:#F8E5E0;
  --paper:#F2F5F6; --card:#FFFFFF; --line:#D6DFE2; --mute:#5B6B73;
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E3EAEC;color:var(--ink);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:inherit}

.app{max-width:1600px;width:100%;height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:clamp(8px,1.6vw,16px);padding:clamp(14px,3.6vh,22px) clamp(9px,1.6vw,18px);background:var(--ink);color:#EEF3F4}
.top-left{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px;min-height:0}
.top h1{font-size:clamp(18px,2.9vw,23px);font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.top-row2{display:flex;align-items:center;gap:6px;min-width:0}
.top .sub{flex:1 1 auto;min-width:0;font-size:clamp(10px,1.4vw,13px);color:#A6BFC7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{flex:none;display:flex;align-items:center;gap:10px}
.when{display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1}
.top .clock{font-size:clamp(24px,7.5vw,34px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.top .date{font-size:clamp(12px,3.4vw,16px);font-weight:700;white-space:nowrap;color:#A6BFC7;line-height:1.2}
.pill{padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);white-space:nowrap;flex:none}
.pill b{font-size:13px}
.pill.out{background:var(--gold);color:var(--ink)}
.pill.absent{background:rgba(255,255,255,.08);color:#BDCED4}
.start-btn{background:var(--leaf);color:#fff;padding:8px 13px;border-radius:11px;font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.start-btn.end{background:var(--ember)}
.start-btn.lunch{background:var(--gold);color:var(--ink)}
.menu-btn{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px;stroke:#EEF3F4;stroke-width:2.2;fill:none;stroke-linecap:round}

.banner{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--gold-soft);border-bottom:1px solid #E5C57E;font-weight:700;font-size:15px}
.banner.leaf{background:var(--leaf-soft);border-color:#BBD9D9}
.banner.paper{background:#fff;border-color:var(--line);color:var(--mute);font-weight:600}
.banner .act{margin-left:auto;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-weight:700;font-size:14px}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr clamp(212px,24%,320px);gap:10px;padding:10px 12px 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:15px;font-weight:700}
.panel-head .hint{color:var(--mute);font-size:13px;margin-left:auto}

.grid{flex:1;padding:10px;display:grid;gap:8px;overflow:auto;align-content:start}
.tile{position:relative;border-radius:13px;padding:clamp(5px,1vh,10px) clamp(7px,0.9vw,11px);min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;border:2px solid transparent;transition:transform .1s}
.tile:active{transform:scale(.97)}
@media (hover:hover){.tile:hover{border-color:var(--leaf)}.dbtn:hover,.reason:hover{border-color:var(--leaf)}}
@media (max-width:560px){
  /* stacked: the roster takes the space, the out list only what it needs */
  .stage{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .stage>.panel:last-child{max-height:36vh}
  #outList{overflow:auto}
  /* nobody out: the header pill already says so, so give the space to the roster */
  .stage.no-out{grid-template-rows:1fr}
  .stage.no-out>.panel:last-child{display:none}
  .top .date{display:none}
}
.tile .name{font-size:var(--name,16px);font-weight:800;line-height:1.15;letter-spacing:-.01em;overflow-wrap:break-word}
.tile .state{font-size:var(--sub,12px);font-weight:600;margin-top:auto;padding-top:3px;color:var(--mute);font-variant-numeric:tabular-nums}
.grid.dense .tile.present .state{display:none}
.tile .name{flex:none}
.grid.dense .tile .tag{margin-bottom:1px}
.tile.present{background:#E7F1F1;border-color:#CFE2E2}
.tile.present .state{color:#0C5C5C}
.tile.deact{background:#EDF1F2;color:#7D8D95;border-style:dashed;border-color:#C6D2D6}
.tile.deact .name{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#B6C4C9}
.tile.deact .state{color:#7D8D95}
.tile.out{background:var(--gold-soft);border-color:var(--gold)}
.tile.out .state{color:#6B4B0C;font-weight:800;font-size:var(--sub,13px)}
.tile.out.long{background:var(--ember-soft);border-color:var(--ember)}
.tile.out.long .state{color:var(--ember)}
.tile .tag{align-self:flex-start;order:-1;margin-bottom:2px;font-size:var(--tag,10px);font-weight:700;padding:2px 6px;border-radius:6px;background:var(--gold-soft);color:#6B4B0C}
.tile .tag.flag{background:var(--ember-soft);color:var(--ember)}
.tile.deact .tag{background:#E2E8EA;color:#6B7A81}
.tile:disabled{opacity:.6;cursor:default}
@media (prefers-reduced-motion:reduce){.tile,.sheet{transition:none;animation:none}}

.out-list{flex:1;overflow:auto;padding:12px}
.out-item{display:grid;grid-template-columns:1fr auto;column-gap:8px;row-gap:6px;align-items:center;padding:clamp(5px,1vh,9px) 10px;border-radius:12px;background:var(--gold-soft);border:1px solid #E5C57E;margin-bottom:8px}
.out-item.long{background:var(--ember-soft);border-color:#E4B4A6}
#outList.compact .out-item{row-gap:0;padding:5px 8px;margin-bottom:5px}
#outList.compact .out-item .who span{display:none}
#outList.compact .out-item .back{grid-column:2;grid-row:2;padding:4px 9px;font-size:12px}
.out-item .who{grid-column:1;grid-row:1;min-width:0}
.out-item .who b{display:block;font-size:clamp(13px,1.7vw,16px);font-weight:800;line-height:1.15}
.out-item .who span{display:block;font-size:11px;line-height:1.3;color:var(--mute)}
.out-item .t{grid-column:2;grid-row:1;justify-self:end;font-size:clamp(16px,2.2vw,21px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.out-item.long .t{color:var(--ember)}
.out-item .back{grid-column:1/-1;grid-row:2;text-align:center;background:var(--ink);color:#fff;border-radius:9px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:var(--mute);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

.reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.reason{border:2px solid var(--line);border-radius:18px;padding:20px 12px;font-size:19px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--card)}
.reason .cap{font-size:12px;font-weight:700;color:var(--mute)}
.reason.capped{border-color:var(--ember);background:var(--ember-soft)}
.reason.capped .cap{color:var(--ember)}
.stepper{display:flex;align-items:stretch;justify-content:center;gap:14px}
.step-btn{width:68px;height:68px;border-radius:18px;border:2px solid var(--line);background:var(--card);font-size:34px;font-weight:800;color:var(--ink);display:grid;place-items:center;flex:none;line-height:1}
.step-btn:active{border-color:var(--gold);background:var(--gold-soft)}
.step-num{width:120px;height:68px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}
.reason:active{border-color:var(--gold);background:var(--gold-soft)}
.reason svg{width:40px;height:40px;stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.reason{position:relative}
.rdot{position:absolute;top:12px;left:12px;width:10px;height:10px;border-radius:50%}
.washroom{background:#2F8F6B}
.water{background:#2E7FB5}
.wudhu{background:#6B5CA5}
.assigned{background:#C0803A}
.other{background:#93A3A9}
.bdots{margin-left:auto;margin-right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding-top:6px}
.bdots .d{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.bdots .d i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)}
.bdots .d i.flagged{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 0 2px var(--ember)}
.bdots span{font-size:12px;font-weight:700;color:var(--mute);white-space:nowrap}
.bdots + .x{margin-left:0}

.scrim{position:absolute;inset:0;background:rgba(31,46,54,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.scrim.show{display:flex}
.sheet{width:100%;max-width:720px;max-height:100%;background:var(--card);border-radius:22px;padding:22px 24px 24px;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:flex-start;gap:14px}
.sheet h3{font-size:24px;font-weight:800;letter-spacing:-.02em}
.sheet p{color:var(--mute);margin-top:4px;font-size:15px;line-height:1.4}
.sheet .x{margin-left:auto;width:44px;height:44px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.sheet .x svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round}
.sheet .body{flex:1;overflow:auto;margin-top:16px;min-height:0}
.actions{display:flex;gap:12px;margin-top:18px}
.btn{flex:1;border-radius:14px;padding:16px;font-size:17px;font-weight:800;text-align:center}
.btn.primary{background:var(--leaf);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--paper);border:1px solid var(--line)}
.btn.warn{background:var(--ember);color:#fff}
.note{margin-top:14px}
.note input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;background:var(--paper)}
.rowlist{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.row b{flex:1;font-size:16px}
.row .time{color:var(--mute);font-size:13px;min-width:130px;text-align:right}
.seg{display:inline-flex;background:var(--card);border:1px solid #C6D2D6;border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:13px;font-weight:700;color:var(--mute);border-right:1px solid #E4EBED}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on.absent{background:var(--ember)}
.seg button.on.tardy{background:var(--gold);color:var(--ink)}
.summary{display:flex;gap:10px;margin-top:14px}
.summary div{flex:1;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;display:flex;justify-content:space-between}
.summary div b{font-size:18px}
.summary .p{background:var(--leaf-soft);color:#0C5C5C}
.summary .t{background:var(--gold-soft);color:#6B4B0C}
.summary .a{background:var(--ember-soft);color:var(--ember)}

.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px 12px 18px;border-radius:12px;display:none;align-items:center;gap:14px;font-weight:600;font-size:15px;z-index:30;box-shadow:0 8px 30px rgba(31,46,54,.25);white-space:nowrap}
.toast.show{display:flex}
.toast button{color:var(--gold);font-weight:800;padding:4px 6px}

.drawer{position:absolute;top:0;left:100%;bottom:0;width:380px;background:var(--card);border-left:1px solid var(--line);transition:left .2s ease;z-index:25;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(31,46,54,.15)}
.drawer.show{left:calc(100% - 380px)}
.drawer .dhead{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer .dhead h3{font-size:18px;font-weight:800}
.drawer .dbody{flex:1;overflow:auto;padding:16px 20px}
.drawer h4{font-size:13px;font-weight:700;color:var(--mute);margin:14px 0 8px}
.drawer h4:first-child{margin-top:0}
.dbtn{display:block;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font-weight:700;font-size:15px;margin-bottom:8px;background:var(--card)}
.dbtn small{display:block;font-weight:500;color:var(--mute);font-size:13px;margin-top:2px}
.dbtn.gold{background:var(--gold-soft);border-color:#E5C57E}
.dbtn.ember{background:var(--ember-soft);border-color:#E4B4A6;color:var(--ember)}
.dbtn.leaf{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.dbtn.leaf small{color:#CFE3F0}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.field small{display:block;font-weight:500;color:var(--mute);font-size:12px;margin-top:2px}
.field select,.field input{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:var(--paper);font-size:14px;width:96px}
.leftday{display:block;width:100%;margin-top:14px;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;color:var(--mute)}
.rrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:700}
.rrow b{flex:1}
.rrow small{font-weight:500;color:var(--mute);font-size:12px}
.rrow button{font-size:13px;font-weight:700;color:var(--ember);padding:4px 6px}
.rrow button.back{color:var(--leaf)}
.rctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 22px 14px}
.rctl select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);font-size:14px;font-weight:700;color:var(--ink)}
.rnav{display:flex;align-items:center;gap:8px;margin-left:auto}
.rnav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;font-weight:800;color:var(--ink)}
.rnav b{font-size:14px;min-width:150px;text-align:center}
.chips{display:flex;gap:10px;padding:0 22px 14px;flex-wrap:wrap}
.chip{flex:1;min-width:104px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:700;color:var(--mute)}
.chip b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.02em;margin-top:2px}
.chip.warn{background:var(--ember-soft);border-color:#E4B4A6;color:var(--ember)}
.chip.warn b{color:var(--ember)}
.stat{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.stat>b{width:94px;font-weight:800}
.bar{flex:1;height:10px;border-radius:6px;background:var(--paper);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.stat .v{width:172px;text-align:right;font-size:13px;font-weight:700;color:var(--mute)}
.stat .v em{font-style:normal;color:var(--ember)}
.two{display:flex;gap:6px}
.two select,.two input{max-width:104px}
.row .time.flag{color:var(--ember);font-weight:800}
.radd{display:flex;gap:8px;margin-top:12px}
.radd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-size:14px}
.radd button{background:var(--ink);color:#fff;border-radius:10px;padding:10px 15px;font-weight:700;font-size:14px}
.setup{position:fixed;inset:0;background:var(--paper);display:none;place-items:center;z-index:80;padding:24px;overflow:auto}
.setup.show{display:grid}
.setup-card{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:580px;width:100%;padding:30px}
.setup-card h2{font-size:27px;letter-spacing:-.02em}
.setup-card .lede{color:var(--mute);font-size:15px;line-height:1.55;margin:9px 0 22px}
.setup-card label{display:block;font-weight:800;font-size:14px;margin-bottom:18px}
.setup-card input,.setup-card textarea{display:block;width:100%;margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;font-weight:600;background:var(--paper);resize:vertical;font-family:inherit}
.setup-card .hint{font-weight:600;color:var(--mute);font-size:13px;margin-top:7px}
.roster-list{margin:12px 0;border:1px solid var(--line);border-radius:12px;max-height:280px;overflow-y:auto;background:var(--paper)}
.roster-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.roster-item:last-child{border-bottom:none}
.roster-item button{color:var(--ember);font-weight:700;font-size:13px;padding:4px 8px}
.roster-add{display:flex;gap:8px}
.roster-add input{flex:1;min-width:0}
.setup-actions{display:flex;align-items:center;gap:12px}
.setup-actions span{color:var(--mute);font-size:14px;font-weight:700}
.setup-actions .btn{margin-left:auto}
.err{color:var(--ember);font-weight:700;font-size:14px;margin-top:12px;min-height:18px}
.tour{position:fixed;inset:0;background:rgba(31,46,54,.55);display:none;place-items:center;z-index:70;padding:24px}
.tour.show{display:grid}
.tour-card{background:var(--card);border-radius:20px;max-width:540px;width:100%;padding:28px}
.tour-card h3{font-size:22px;letter-spacing:-.01em}
.tour-card p{font-size:15px;line-height:1.6;color:var(--mute);margin-top:10px}
.tour-steps{display:flex;gap:6px;margin:20px 0 22px}
.tour-steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.tour-steps i.on{background:var(--leaf)}
.tour-actions{display:flex;gap:10px;align-items:center}
.tour-actions .skip{color:var(--mute);font-weight:700;font-size:14px;margin-right:auto}
.rh{font-size:13px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 4px}
.log{font-size:13px;color:var(--mute);line-height:1.5}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log b{color:var(--ink)}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="top-left">
      <h1 id="title">Hifz Class</h1>
      <div class="top-row2">
        <span class="pill">In class <b id="cIn">0</b></span>
        <span class="pill out">Out <b id="cOut">0</b></span>
        <span class="pill absent">Not here <b id="cAbs">0</b></span>
        <div class="sub" id="sub"></div>
      </div>
    </div>
    <div class="top-right">
      <div class="when"><div class="date" id="date"></div><div class="clock" id="clock"></div></div>
      <button class="start-btn" id="mainBtn" onclick="mainAction()"></button>
      <button class="menu-btn" aria-label="Teacher menu" onclick="openDrawer()"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

/* ===== durable storage: localStorage on the web, native SharedPreferences on
   Android via @capacitor/preferences (survives WebView data clears - plain
   localStorage does not reliably on native, which is what caused "loses my
   data when the app shuts down"). Reads are synchronous off an in-memory
   cache hydrated once at boot; writes are fire-and-forget, same best-effort
   spirit as the try/catch localStorage calls this file already used. ===== */
const Store=(function(){
  const native=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Preferences);
  const Prefs=native?window.Capacitor.Plugins.Preferences:null;
  const cache={};
  async function hydrate(keys){
    await Promise.all(keys.map(async k=>{
      if(native){
        try{
          const r=await Prefs.get({key:k});
          if(r&&r.value!=null){ cache[k]=r.value; return; }
        }catch(e){}
        // Preferences has nothing for this key. Before this device ever had
        // the Preferences plugin (pre-Phase-1 native builds), everything was
        // written straight to the WebView's own localStorage - that data is
        // still sitting there, just invisible to Prefs.get(). Fall back to
        // it, and promote it into Preferences once so it's durable from here
        // on. Never delete the localStorage copy - it's harmless once
        // promoted, and it's exactly the kind of local safety net the rest
        // of this app relies on (see the "legacy local keys" note below).
        let fallback=null;
        try{ fallback=localStorage.getItem(k); }catch(e){}
        cache[k]=fallback;
        if(fallback!=null){ try{ await Prefs.set({key:k,value:fallback}); }catch(e){} }
        return;
      }
      try{ cache[k]=localStorage.getItem(k); }catch(e){ cache[k]=null; }
    }));
  }
  function get(key){ return Object.prototype.hasOwnProperty.call(cache,key) ? cache[key] : (()=>{ try{ return localStorage.getItem(key); }catch(e){ return null; } })(); }
  function set(key,value){
    cache[key]=value;
    if(native){ Prefs.set({key,value}).catch(()=>{}); return; }
    try{ localStorage.setItem(key,value); }catch(e){}
  }
  function remove(key){
    cache[key]=null;
    if(native){ Prefs.remove({key}).catch(()=>{}); return; }
    try{ localStorage.removeItem(key); }catch(e){}
  }
  return {hydrate,get,set,remove,native};
})();

/* ===== Firestore: the source of truth (IMPLEMENTATION_PLAN.md section 2) =====

   Sign-In yet (that's Phase 4/2.8), so auth stays anonymous and the org's
   random id plays the role the old "class code" did: knowing it is what
   "having access" means (see firestore.rules). A second device "joins" by
   writing its own membership doc for that org id - same trust boundary as
   before, now a real record instead of an implicit one.

   Offline persistence (enablePersistence) means normal use never talks to
   the network directly - reads come from the local cache and writes queue
   and flush on reconnect automatically. That, plus every mutation below
   going through a named writer instead of a blanket save(), is what "source
   of truth" means day to day: there is exactly one place this data lives,
   and this device's copy of it is a cache, not a second original. */

function initFirestore(){

   the UI is already updated optimistically before this resolves. */
async function bootstrapOrg(){

      schemaVersion:3, name:`${state.teacher||'My'}'s Hifz Class`, kind:'personal',
      activeYearId:academicYearId(new Date()), defaults:settingsToDefaults(state.settings),
      createdAt:now, updatedAt:now

    await fsWrite(org.collection('members').doc(fbUid).set({
      email:'', displayName:state.teacher||'', roles:['admin','teacher'], status:'active', joinedAt:now
    }));

      name:`${state.teacher||'My'}'s Hifz Class`, teacherUid:fbUid, settingsOverride:null, status:'active'
    }));

      org.collection('classes').doc(CLASS_ID).collection('students').doc(s.id).set({
        name:s.name, active:!!s.active, order:i, enrolledFrom:dayId(new Date()), enrolledUntil:null
      })
    )));
    await fsWrite(org.collection('classes').doc(CLASS_ID).collection('days').doc(dayId(new Date())).set({
      date:dayId(new Date()), yearId:academicYearId(new Date()),
      session:sessionToPlain(state.session), attendance:fullAttendancePlain(), roster:fullRosterPlain(),
      updatedAt:now

/* Covers the one edge case Firebase Auth itself can't queue offline: a
   brand-new install's very first anonymous sign-in needs one network round
   trip. If that fails, the class still works locally (state is already
   updated) and this retries quietly once connectivity returns. */
function scheduleBootstrapRetry(){
  if(scheduleBootstrapRetry._armed) return;

  window.addEventListener('online',function once(){
    window.removeEventListener('online',once); scheduleBootstrapRetry._armed=false;
    if(!ORG_ID && state.setup) bootstrapOrg();

function detachListeners(){ [unsubOrg,unsubClass,unsubStudents,unsubDay,unsubBreaks].forEach(u=>u&&u()); unsubOrg=unsubClass=unsubStudents=unsubDay=unsubBreaks=null; }
async function attachToOrg(orgId){
  syncStatus='connecting'; render();

    // back online - do NOT fall back to setup just because we can't reach
    // the network yet (plan 2.1: the app must keep working offline).
    ORG_ID=orgId; syncStatus='error'; render(); scheduleBootstrapRetry(); return;
  }

    const snap=await orgRefFor(orgId).get();

      // from plan 2.9, not the offline case above.
      Store.remove(SESSION_ORG_KEY); Store.remove(SESSION_CLASS_KEY); Store.remove(CACHE_KEY);
      syncStatus='offline'; return openSetup();

    // it's still good and let the realtime listeners recover once connected.

    if(qs.metadata.hasPendingWrites) return;

function attachDayListeners(){
  if(unsubDay) unsubDay(); if(unsubBreaks) unsubBreaks();
  TODAY_ID=dayId(new Date());
  const d=dayRef(TODAY_ID);
  unsubDay=d.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites||!snap.exists) return;
    const data=snap.data();
    if(data.session) state.session=plainToSession(data.session);
    if(data.attendance) state.attendance=plainToAttendance(data.attendance);
    ensureAttendance(); render();
  },()=>{});
  unsubBreaks=d.collection('breaks').onSnapshot(qs=>{
    if(qs.metadata.hasPendingWrites) return;
    const active={}, done=[];
    qs.forEach(doc=>{
      const b=doc.data(), r=RSN(b.reason);
      if(b.endAt==null){ active[b.sid]={reason:b.reason,label:r.label,startAt:new Date(b.startAt),note:'',allowMs:b.allowMs||0,assignedMin:b.assignedMin||null,overTrip:!!b.overTrip,_id:doc.id}; }
      else{ done.push({sid:b.sid,reason:b.reason,label:r.label,startAt:new Date(b.startAt),endAt:new Date(b.endAt),dur:b.dur,allowMs:b.allowMs||0,assignedMin:b.assignedMin||null,over:b.over||0,overTrip:!!b.overTrip,flag:!!b.flag,note:'',_id:doc.id}); }
    });
    done.sort((a,b)=>a.startAt-b.startAt);
    state.active=active; state.breaks=done; render();
  },()=>{});
}

/* ===== legacy local-history migration (Phase 3, plan section 4) =====
   Every device that ever ran this app pre-Firestore (or ran Phase 2, which
   still wrote local history alongside the day docs) has its own
   `hifz.tracker.history` (HKEY) of days that may or may not already be in
   Firestore - written by this same device before it had an org, or by a
   completely different device. Two devices can hold DIFFERENT subsets.

   The rule: Firestore's day doc for a date, if one already exists, always
   wins - this device's local copy of that same date is left untouched (it
   is never deleted, so nothing is lost even if it's skipped). Only dates
   Firestore doesn't have yet get uploaded. That is what makes this a merge
   instead of a replace, and safe to run from any number of devices in any
   order. A transaction closes the one real race (two devices migrating the
   same missing date at the same moment) by making "check, then write"
   atomic per day.

   Runs once per device (MIGRATION_FLAG_KEY guards it), after this device
   has real listeners attached to an org - never blocks boot, never retries
   in a tight loop, and never touches HKEY itself (read-only forever after,
   same as PKEY/KEY - see the "legacy local keys" note near the top).

   The ".v2" is deliberate, not decoration: the first shipped version of this
   flag was missing from boot()'s Store.hydrate() list, so on native it was
   read via Store.get()'s raw-localStorage fallback (always empty, since
   set() on native writes to Preferences, not localStorage) while being
   *written* to Preferences successfully. Combined with the hydrate() bug
   above - which made HKEY itself read as empty on native - affected devices
   already durably recorded "done" in Preferences against a wrongly-empty
   history. Fixing hydrate() alone would make that stale done-flag readable
   again and permanently skip the real migration. The new key name forces
   every existing install to run this once more, now that both bugs are
   fixed and HKEY is actually visible. Do not rename it again without the
   same reasoning - each rename is a one-time "everyone re-migrates" event. */
const MIGRATION_FLAG_KEY='migration.legacyHistoryDone.v2';
const MIGRATION_FAILURES_KEY='migration.failures';
window.__hifzMigrationDone=false;
/* Each day is its own try/catch - a bug or a transient failure on one date
   must never take the rest of the archive down with it (the original bug:
   one throw inside the loop hit the OUTER try/catch, which aborted every
   day after it and left the flag unset, so the very next boot walked into
   the exact same failing day first and aborted again - the run could never
   get past it). Failures are recorded (date + message), not swallowed, and
   the global flag is only ever set to done when EVERY day succeeded, so a
   run with failures naturally retries on the next boot - already-migrated
   days are cheap no-ops (mergeDayIntoFirestoreIfMissing's existence check
   skips them immediately), so this is safe to repeat. */
async function migrateLegacyHistoryIfNeeded(){
  if(Store.get(MIGRATION_FLAG_KEY)==='1'||!ORG_ID){ window.__hifzMigrationDone=true; return; }
  const h=readHistory();
  const failures={};
  for(const id of Object.keys(h)){
    try{ await mergeDayIntoFirestoreIfMissing(id,h[id]); }
    catch(e){ failures[id]=String((e&&e.message)||e); }
  }
  Store.set(MIGRATION_FAILURES_KEY,JSON.stringify(failures));
  if(Object.keys(failures).length===0) Store.set(MIGRATION_FLAG_KEY,'1');
  window.__hifzMigrationDone=true;
}
/* Shared by migration above and restoreBackup() below - both are "I have a
   day snapshot from somewhere else, make sure Firestore has it" and both
   need the same non-destructive rule: an existing Firestore day always
   wins, never overwritten. */
async function mergeDayIntoFirestoreIfMissing(id,snap){
  const dRef=classRef().collection('days').doc(id);
  await fbDb.runTransaction(async tx=>{
    const existing=await tx.get(dRef);
    if(existing.exists) return;                          // Firestore already has this date - never overwrite it
    const dateObj=new Date(id+'T00:00:00');
    tx.set(dRef,{
      date:id, yearId:academicYearId(dateObj),
      session:{status:'ended',startedAt:snap.startedAt||null,endedAt:snap.endedAt||null,lunchAt:null,pauseLabel:null,resumeAt:null},
      attendance:Object.fromEntries(Object.entries(snap.att||{}).map(([sid,a])=>[sid,{status:a.status,at:null,note:a.note||''}])),
      roster:snap.names||{},
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    (snap.breaks||[]).forEach((b,i)=>{
      tx.set(dRef.collection('breaks').doc('legacy'+i),{
        sid:b.sid, reason:b.reason, startAt:null, endAt:null, dur:b.dur||0,
        over:b.over||0, flag:!!b.flag, overTrip:!!b.overTrip, assignedMin:b.assignedMin||null
      });
    });
  });
}

function undo(){
  const a=state.lastAction; if(!a) return;
  if(a.type==='checkout') delete state.active[a.sid];
  if(a.type==='return'){ state.breaks=state.breaks.filter(b=>b!==a.rec); state.active[a.sid]=a.prev; }

  state.log.shift(); state.lastAction=null; $('toast').classList.remove('show'); render();

/* ===== the tile tap: one gesture, context decides ===== */
function editBreak(sid){
  const o=state.active[sid]; if(!o) return;
  const now=Date.now(), elapsed=now-o.startAt, hours=Math.floor(elapsed/3600000), mins=Math.floor((elapsed%3600000)/60000), secs=Math.floor((elapsed%60000)/1000);
  const stStart=new Date(o.startAt), stEnd=new Date(now);
  const timeStr=(d)=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  sheetHTML(`${nameOf(sid)} is out for ${o.label}`,'',
   `<div class="body">
    <div style="display:flex;gap:12px;margin-bottom:16px">
      <div style="flex:1">
        <div style="font-size:12px;font-weight:500;color:var(--mute);margin-bottom:6px">Left at</div>
        <input id="startTime" type="time" value="${timeStr(stStart)}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px">
      </div>
      <div style="flex:1">
        <div style="font-size:12px;font-weight:500;color:var(--mute);margin-bottom:6px">Return at (now)</div>
        <input id="endTime" type="time" value="${timeStr(stEnd)}" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:13px">
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px;padding:10px;background:var(--paper);border-radius:8px">
      <div style="flex:1">
        <div style="font-size:13px;font-weight:500">Elapsed</div>
        <div style="font-size:18px;font-weight:600;color:var(--leaf)">${hours}h ${mins}m ${secs}s</div>
      </div>
      <div style="flex:1;text-align:right">
        <div style="font-size:12px;color:var(--mute)">Allowed</div>
        <div style="font-size:15px;font-weight:600">${o.allowMs?fmtDur(o.allowMs):'unlimited'}</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn dark" onclick="saveBreakEdits('${sid}')">Return ${nameOf(sid)}</button>
      <button class="btn ghost" onclick="cancelBreak('${sid}')">Cancel break</button>
    </div>
   </div>`);
}
function saveBreakEdits(sid){
  const o=state.active[sid]; if(!o) return closeSheet();
  const startTime=$('startTime').value, endTime=$('endTime').value;
  if(!startTime||!endTime) return toast('Please set both times.');
  const [sh,sm]=startTime.split(':'), [eh,em]=endTime.split(':');
  const now=new Date(), stStart=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+sh,+sm), stEnd=new Date(now.getFullYear(),now.getMonth(),now.getDate(),+eh,+em);
  if(stStart>stEnd) return toast('Start time cannot be after end time.');
  o.startAt=stStart; ret(sid);
}
function cancelBreak(sid){
  confirmSheet(`Cancel ${nameOf(sid)}'s break for ${state.active[sid].label}?`,'The break will be removed and not recorded.','Delete break',()=>{
    logIt(`<b>${nameOf(sid)}</b>'s break cancelled`);
    writeBreakCancel(state.active[sid]._id);
    delete state.active[sid]; closeSheet(); toast(`${nameOf(sid)}'s break cancelled`,true); render();
  },'warn','Keep the break');
}

function tap(sid){
  const a=att(sid), o=state.active[sid], s=st();
  if(o) return editBreak(sid);                                   // out -> back in
  if(s==='preclass'){                                       // before start: toggle presence
    const prev={...a};
    if(a.status==='absent'){ a.status='present'; a.at=null; a.note=''; logIt(`<b>${nameOf(sid)}</b> re-activated before class`); toast(`${nameOf(sid)} marked present`,true); }
    else { a.status='absent'; a.at=null; a.note='Deactivated before class'; logIt(`<b>${nameOf(sid)}</b> deactivated (not here)`); toast(`${nameOf(sid)} marked not here`,true); }
    state.lastAction={type:'att',sid,prev}; writeAttendance(sid); return render();
  }
  if(s==='ended') return toast('Class has ended for today.');
  if(s==='lunch') return toast(`${state.session.pauseLabel||'Break'}: individual breaks are paused.`);
  if(a.status==='absent'){                                  // after start: activate as tardy
    const prev={...a}, now=new Date();
    a.status='tardy'; a.at=now; a.note=`Arrived ${clockStr(now)}, ${Math.max(1,Math.round((now-state.session.startedAt)/60000))} min after start`;
    logIt(`<b>${nameOf(sid)}</b> activated, marked tardy at ${clockStr(now)}`);
    state.lastAction={type:'att',sid,prev}; writeAttendance(sid); toast(`${nameOf(sid)} is here · tardy, ${clockStr(now)}`,true); return render();
  }
  openReason(sid);                                          // present -> break
}
function markLeft(sid){
  const a=att(sid), prev={...a}, now=new Date();
  if(state.active[sid]) ret(sid,true);
  a.status='absent'; a.at=now; a.note=`Left at ${clockStr(now)}`;
  logIt(`<b>${nameOf(sid)}</b> left for the day at ${clockStr(now)}`);
  state.lastAction={type:'att',sid,prev}; writeAttendance(sid); closeSheet(); toast(`${nameOf(sid)} left for the day`,true); render();
}
function checkout(sid,key,note,assignedMin){
  const r=RSN(key), lim=LIMIT(key), overTrip=!!(lim&&tripsUsed(sid,key)>=lim.trips);
  state.active[sid]={reason:key,label:r.label,startAt:new Date(),note:note||'',allowMs:capMs(key,assignedMin),assignedMin:assignedMin||null,overTrip};
  const durNote=!assignedMin?'':key==='assigned'?` (${assignedMin} min assigned)`:` (~${assignedMin} min expected)`;
  logIt(`<b>${nameOf(sid)}</b> out · ${r.label}${durNote}${overTrip?' · past the daily limit':''}`);
  state.lastAction={type:'checkout',sid}; writeBreakStart(sid); closeSheet();
  toast(overTrip?`${nameOf(sid)} out for ${r.label.toLowerCase()} · past the daily limit`:`${nameOf(sid)} out for ${r.label.toLowerCase()}`,true);
  render();
}
function ret(sid,silent){
  const a=state.active[sid]; if(!a) return;
  const dur=Date.now()-a.startAt, over=a.allowMs?Math.max(0,dur-a.allowMs):0;
  const rec={sid,reason:a.reason,label:a.label,startAt:a.startAt,endAt:new Date(),dur,
             allowMs:a.allowMs,assignedMin:a.assignedMin||null,over,overTrip:!!a.overTrip,note:a.note||'',_id:a._id};
  rec.flag=over>0||rec.overTrip;
  state.breaks.push(rec); delete state.active[sid]; writeBreakEnd(rec);
  logIt(`<b>${nameOf(sid)}</b> back after ${fmtDur(dur)}${over?` · ${fmtDur(over)} over the ${a.label.toLowerCase()} limit`:''}${rec.overTrip?' · past the daily limit':''}`);
  state.lastAction={type:'return',sid,rec,prev:a}; closeSheet();
  if(!silent) toast(rec.flag?`${nameOf(sid)} back after ${fmtDur(dur)} · flagged`:`${nameOf(sid)} back after ${fmtDur(dur)}`,true);
  render();
}

/* ===== class-wide ===== */
function mainAction(){ const s=st(); if(s==='preclass'||s==='ended') doStart(); else if(s==='lunch') endPause(); else endClass(); }
function doStart(){
  const now=new Date(); state.session={status:'live',startedAt:now,endedAt:null,lunchAt:null};
  state.students.forEach(s=>{ const a=att(s.id); if(a.status==='present'){ a.at=now; } });
  const abs=roster().filter(s=>att(s.id).status==='absent').length;
  logIt(`Class started · ${roster().length-abs} present, ${abs} not here`);
  writeSessionAndAttendance(); closeSheet(); closeDrawer(); toast(`Class started at ${clockStr(now)}`); render();
}
function endClass(){
  confirmSheet('End class for today?','Open breaks will be closed. Students still deactivated stay marked absent.','End class',()=>{
    Object.keys(state.active).forEach(sid=>ret(sid,true));
    state.session.status='ended'; state.session.endedAt=new Date(); logIt('Class ended');
    writeSessionAndAttendance(); closeSheet(); closeDrawer(); toast('Class ended'); render();
  },'warn');
}
function startPause(kind,resumeAt){
  confirmSheet(`Start ${kind.toLowerCase()} for the whole class?`,'Open breaks are closed and individual timers stop. This time is not counted against anyone.',`Start ${kind.toLowerCase()}`,()=>{
    Object.keys(state.active).forEach(sid=>ret(sid,true));
    state.session.status='lunch'; state.session.lunchAt=new Date(); state.session.pauseLabel=kind; state.session.resumeAt=resumeAt||null;
    logIt(`${kind} started`); writeSessionAndAttendance(); closeSheet(); closeDrawer(); toast(`${kind} started`); render();
  });
}
function endPause(){
  const k=state.session.pauseLabel||'Break';
  state.session.status='live'; state.session.lunchAt=null; state.session.pauseLabel=null; state.session.resumeAt=null;
  logIt(`${k} ended`); writeSessionAndAttendance(); closeDrawer(); toast('Back in class'); render();
}
/* Prototype/dev tool (see the drawer label) - resets this device's view of
   today instantly. It does not delete any break documents already written
   to Firestore for today; those are harmless leftover test data, consistent
   with the rules never allowing bulk delete (plan 9, "do not delete data"). */
function resetDay(){ state.session={status:'preclass',startedAt:null,endedAt:null,lunchAt:null,pauseLabel:null,resumeAt:null}; state.students.forEach(s=>state.attendance[s.id]={status:'present',at:null,note:''}); state.active={}; state.breaks=[]; state.log=[]; writeSessionAndAttendance(); closeDrawer(); render(); }

/* ===== sheets ===== */
function sheetHTML(title,sub,body,extra){
  $('sheet').innerHTML=`<div class="sheet-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${extra||''}<button class="x" aria-label="Close" onclick="closeSheet()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>${body}`;
  $('scrim').classList.add('show');
}
function closeSheet(){ $('scrim').classList.remove('show'); }
function openReason(sid){
  const bs=state.breaks.filter(b=>b.sid===sid), mins=Math.round(bs.reduce((a,b)=>a+b.dur,0)/60000), fl=bs.filter(b=>b.flag).length;
  const dots = bs.length ? `<div class="bdots" title="Breaks so far today"><div class="d">${bs.map(b=>`<i class="${b.reason}${b.flag?' flagged':''}" title="${b.label} · ${fmtDur(b.dur)}"></i>`).join('')}</div><span>${bs.length} today · ${mins} min${fl?` · ${fl} flagged`:''}</span></div>` : '';
  sheetHTML(`Where is ${nameOf(sid)} going?`,'The timer starts as soon as you pick a reason.',
    `<div class="body"><div class="reasons">${REASONS.map(r=>{
       const lim=LIMIT(r.key), used=tripsUsed(sid,r.key), capped=!!(lim&&used>=lim.trips);
       const cap = r.key==='assigned' ? 'you set the minutes'
                 : r.key==='other' ? 'you set the expected time'
                 : lim ? (capped?`${used} of ${lim.trips} used`:`${used} of ${lim.trips} · ${lim.min} min each`)
                 : `alert after ${state.settings.longMin} min`;
       const act = (r.key==='assigned'||r.key==='other') ? `openMinutesSheet('${sid}','${r.key}')` : `checkout('${sid}','${r.key}',($('rnote')||{}).value)`;
       return `<button class="reason ${capped?'capped':''}" onclick="${act}"><i class="rdot ${r.key}"></i>${r.icon}${r.label}<span class="cap">${capped?'over daily limit':cap}</span></button>`;
     }).join('')}</div>
     <div class="note"><input id="rnote" placeholder="Optional short note"></div>
     <button class="leftday" onclick="markLeft('${sid}')">${nameOf(sid)} left for the day</button></div>`, dots);
}
/* Shared by "Assigned" and "Other" - both let the teacher set an expected
   duration 1-10 min (prefilled 2) with the same stepper, but the two reasons
   mean different things and must read differently: Assigned is excused time

/* The escape hatch if sync misbehaves (plan 5) - exports everything
   Firestore has for this class, not just what this device happens to hold
   locally, since Firestore is the merged, authoritative copy across every
   device by now (Phase 3). Falls back to this device's local HKEY entries
   for any date Firestore doesn't have (e.g. offline, or not yet migrated). */
async function backupAll(){
  const remote=await fetchAllDays();
  const history=Object.assign({},readHistory(),remote);
  if(hasActivity()) history[dayId(new Date())]=snapshot();
  const data={saved:new Date().toISOString(),profile:{teacher:state.teacher,setup:state.setup,students:state.students,settings:state.settings},history};
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
    a.download=`hifz-backup-${dayId(new Date())}.json`; a.click(); toast('Backup downloaded');
  }catch(e){ toast('Backup is not available in this preview'); }
}
function restoreBackup(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.profile){
        if(Array.isArray(d.profile.students)) state.students=d.profile.students;
        if(d.profile.teacher) state.teacher=d.profile.teacher;
        state.settings=mergeSettings(d.profile.settings); ensureAttendance();
        state.students.forEach(writeRosterStudent); writeSettings();
      }
      if(d.history){
        writeHistory(Object.assign({},readHistory(),d.history));      // keep a local copy too, same safety-net spirit as HKEY elsewhere
        if(ORG_ID) for(const id of Object.keys(d.history)) await mergeDayIntoFirestoreIfMissing(id,d.history[id]);
      }
      toast('Backup restored'); render();
    }catch(e){ toast('That file could not be read'); }
  };
  r.readAsText(f); input.value='';
}

/* ===== legacy local history (HKEY) - read-only from here on =====
   Firestore day docs are the source of truth for reports now (Phase 3).
   HKEY is kept only as: (a) the migration source in migrateLegacyHistoryIfNeeded()
   above, and (b) a same-day live fallback (snapshot()/hasActivity() below,
   built straight from `state`, not from HKEY - "today" is always shown live
   rather than round-tripping to Firestore for a day that's still changing).
   Nothing writes to HKEY going forward; it is never deleted either (plan 9). */
const HKEY='hifz.tracker.history';
const dayId=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function writeHistory(h){ Store.set(HKEY,JSON.stringify(h)); }
function hasActivity(){ return state.breaks.length>0 || st()!=='preclass'; }
function snapshot(){
  return {
    date:dayId(new Date()),
    startedAt:state.session.startedAt?+state.session.startedAt:null,
    endedAt:state.session.endedAt?+state.session.endedAt:null,
    names:Object.fromEntries(state.students.map(x=>[x.id,x.name])),
    att:Object.fromEntries(roster().map(x=>[x.id,{status:att(x.id).status,note:att(x.id).note||''}])),
    breaks:state.breaks.map(b=>({sid:b.sid,reason:b.reason,dur:b.dur,over:b.over||0,flag:!!b.flag,overTrip:!!b.overTrip,assignedMin:b.assignedMin||null}))
  };
}

/* ===== reports: read from Firestore day docs (plan 2.3 - a bounded get()
   over a date range, never a listener, so a month view is at most ~31 day
   reads + their breaks, served from cache when offline) ===== */
function dayDocToSnapshot(data,breaksArr){
  return {
    date:data.date,
    startedAt:(data.session&&data.session.startedAt)||null,
    endedAt:(data.session&&data.session.endedAt)||null,
    names:data.roster||{},
    att:Object.fromEntries(Object.entries(data.attendance||{}).map(([id,a])=>[id,{status:a.status,note:a.note||''}])),
    breaks:breaksArr.map(b=>({sid:b.sid,reason:b.reason,dur:b.dur,over:b.over||0,flag:!!b.flag,overTrip:!!b.overTrip,assignedMin:b.assignedMin||null}))
  };
}
async function daysQueryToMap(query){
  const qs=await query.get();
  const out={};
  await Promise.all(qs.docs.map(async doc=>{
    const breaksQs=await doc.ref.collection('breaks').get();
    out[doc.id]=dayDocToSnapshot(doc.data(),breaksQs.docs.map(b=>b.data()));
  }));
  return out;
}
async function fetchDayRange(startId,endId){
  if(!ORG_ID) return {};
  const fp=firebase.firestore.FieldPath.documentId();
  return daysQueryToMap(classRef().collection('days').where(fp,'>=',startId).where(fp,'<=',endId));
}
/* Unbounded on purpose - backupAll() is a one-time, user-initiated export,
   not a listener or something that runs on a schedule, so a full history
   read here doesn't fight the "bounded get() over a date range" rule that
   applies to reports (plan 2.3). */
async function fetchAllDays(){

}
const rpt={scope:'class',sid:null,kind:'day',offset:0};
function periodDays(kind,offset){
  const now=new Date(); let start,end,label;
  if(kind==='day'){ start=new Date(now); start.setDate(start.getDate()+offset); end=new Date(start);
    label=start.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'}); }
  else if(kind==='week'){ start=new Date(now); start.setDate(start.getDate()-((start.getDay()+6)%7)+offset*7);
    end=new Date(start); end.setDate(start.getDate()+6);
    label=`Week of ${start.toLocaleDateString([],{month:'short',day:'numeric'})}`; }
  else { start=new Date(now.getFullYear(),now.getMonth()+offset,1); end=new Date(start.getFullYear(),start.getMonth()+1,0);
    label=start.toLocaleDateString([],{month:'long',year:'numeric'}); }
  const ids=[]; const c=new Date(start); c.setHours(0,0,0,0); end.setHours(0,0,0,0);
  while(c<=end){ ids.push(dayId(c)); c.setDate(c.getDate()+1); }
  return {ids,label};
}
async function reportDays(){
  const {ids,label}=periodDays(rpt.kind,rpt.offset), tid=dayId(new Date());
  const remote=ids.length?await fetchDayRange(ids[0],ids[ids.length-1]):{};
  const days=ids.map(id=>(id===tid&&hasActivity())?snapshot():remote[id]).filter(Boolean);
  return {days,label};
}
function agg(days,sid){
  const per={}, out={trips:0,mins:0,flags:0,over:0,att:{present:0,tardy:0,absent:0}};
  REASONS.forEach(r=>per[r.key]={trips:0,mins:0,flags:0,over:0});
  days.forEach(d=>{
    Object.entries(d.att||{}).forEach(([id,a])=>{ if(sid&&id!==sid) return; if(out.att[a.status]!==undefined) out.att[a.status]++; });
    (d.breaks||[]).forEach(b=>{ if(sid&&b.sid!==sid) return;
      const q=per[b.reason]||(per[b.reason]={trips:0,mins:0,flags:0,over:0});
      const m=b.dur/60000, ov=(b.over||0)/60000;
      q.trips++; q.mins+=m; q.flags+=b.flag?1:0; q.over+=ov;
      out.trips++; out.mins+=m; out.flags+=b.flag?1:0; out.over+=ov;
    });
  });
  return {per,out};
}
function setReport(k,v){ if(k==='kind'){ rpt.kind=v; rpt.offset=0; } else if(k==='scope'){ rpt.scope=v; } else if(k==='sid'){ rpt.sid=v; } else if(k==='offset'){ rpt.offset+=v; } openReports(); }

}

function archiveStudent(sid){
  const s=state.students.find(x=>x.id===sid); if(!s) return;
  if(state.active[sid]) ret(sid,true);
  s.active=false; logIt(`<b>${s.name}</b> removed from the class list`); writeRosterStudent(s); render(); drawDrawer(); toast(`${s.name} removed from the list`);
}
function restoreStudent(sid){
  const s=state.students.find(x=>x.id===sid); if(!s) return;
  s.active=true; logIt(`<b>${s.name}</b> put back on the class list`); writeRosterStudent(s); render(); drawDrawer();
}

/* ===== drawer ===== */
function openDrawer(){ $('drawer').classList.add('show'); $('drawerScrim').classList.add('show'); drawDrawer(); }
function closeDrawer(){ $('drawer').classList.remove('show'); $('drawerScrim').classList.remove('show'); }
function drawDrawer(){
  const s=st(), set=state.settings;
  $('dbody').innerHTML=`
   <h4>Class-wide</h4>
   ${s==='live'?`<button class="dbtn gold" onclick="startPause('Snack break','${set.snack.end}')">Start snack break<small>Scheduled ${hm(set.snack.start)} to ${hm(set.snack.end)}</small></button>`:''}
   ${s==='live'?`<button class="dbtn gold" onclick="startPause('Lunch and recess','${set.lunch.end}')">Start lunch and recess<small>Scheduled ${hm(set.lunch.start)} to ${hm(set.lunch.end)}</small></button>`:''}
   ${s==='lunch'?`<button class="dbtn leaf" onclick="endPause()">End ${(state.session.pauseLabel||'break').toLowerCase()}</button>`:''}
   ${s==='live'||s==='lunch'?`<button class="dbtn ember" onclick="endClass()">End class<small>Closes open breaks</small></button>`:''}
   ${s==='preclass'||s==='ended'?`<button class="dbtn leaf" onclick="doStart()">Start class<small>Anyone not deactivated is marked present</small></button>`:''}
   <h4>Review</h4>
   <button class="dbtn" onclick="openAttendanceReview()">Attendance today<small>Correct present, tardy, absent</small></button>
   <button class="dbtn" onclick="openDaySummary()">Day summary<small>Attendance and break totals per student</small></button>
   <button class="dbtn" onclick="openReports()">Reports<small>Daily, weekly, monthly · class or one student</small></button>
   <h4>Class list</h4>
   ${state.students.filter(x=>x.active).map((x,i)=>`<div class="rrow"><b>${i+1}. ${x.name}</b><button onclick="archiveStudent('${x.id}')">Remove</button></div>`).join('')}
   ${state.students.some(x=>!x.active)?`${state.students.filter(x=>!x.active).map(x=>`<div class="rrow"><b>${x.name}</b><small>removed</small><button class="back" onclick="restoreStudent('${x.id}')">Put back</button></div>`).join('')}`:''}
   <div class="radd"><input id="newName" placeholder="New student's name" onkeydown="if(event.key==='Enter')addStudent()"><button onclick="addStudent()">Add</button></div>
   <h4>Settings</h4>
   <div class="field"><div>Class hours<small>Monday to Friday</small></div><span class="two"><input type="time" value="${set.startTime}" onchange="state.settings.startTime=this.value;writeSettings();render();drawDrawer()"><input type="time" value="${set.endTime}" onchange="state.settings.endTime=this.value;writeSettings();render();drawDrawer()"></span></div>
   <div class="field"><div>Snack break<small>School-wide</small></div><span class="two"><input type="time" value="${set.snack.start}" onchange="state.settings.snack.start=this.value;writeSettings();render();drawDrawer()"><input type="time" value="${set.snack.end}" onchange="state.settings.snack.end=this.value;writeSettings();render();drawDrawer()"></span></div>
   <div class="field"><div>Lunch and recess<small>School-wide</small></div><span class="two"><input type="time" value="${set.lunch.start}" onchange="state.settings.lunch.start=this.value;writeSettings();render();drawDrawer()"><input type="time" value="${set.lunch.end}" onchange="state.settings.lunch.end=this.value;writeSettings();render();drawDrawer()"></span></div>
   <h4>Break limits</h4>
   ${['washroom','water','wudhu'].map(k=>`<div class="field"><div>${RSN(k).label}<small>Minutes per trip · trips per day</small></div><span class="two">
     <select onchange="state.settings.limits.${k}.min=+this.value;writeSettings();render();drawDrawer()">${[1,2,3,5,7,10].map(m=>`<option ${set.limits[k].min===m?'selected':''} value="${m}">${m} min</option>`).join('')}</select>
     <select onchange="state.settings.limits.${k}.trips=+this.value;writeSettings();render();drawDrawer()">${[1,2,3,4,5].map(m=>`<option ${set.limits[k].trips===m?'selected':''} value="${m}">${m}/day</option>`).join('')}</select></span></div>`).join('')}
   <h4>Today's log</h4>
   <div class="log">${state.log.length?state.log.map(l=>`<div>${clockStr(l.t)} · ${l.msg}</div>`).join(''):'<div>Nothing yet.</div>'}</div>
   <h4>Sync</h4>
   <button class="dbtn" onclick="openSyncInfo()">${ORG_ID?`This device is synced<small>${syncStatusLabel()}</small>`:'Connecting…<small>This class will be available on other devices shortly</small>'}</button>
   <h4>Prototype</h4>
   <small style="display:block;color:var(--mute);font-size:12px;line-height:1.5;margin:-2px 0 10px">Reports read live from the cloud, so every device sees the same history.${Object.keys(readHistory()).length?` This device also keeps a local backup of ${Object.keys(readHistory()).length} earlier day(s) from before it synced.`:''}</small>
   <button class="dbtn" onclick="resetDay()">Reset the day</button>
   <small style="display:block;color:var(--mute);font-size:11px;line-height:1.5;margin-top:14px;text-align:center">v${APP_VERSION} · build ${APP_BUILD}${window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()?' · native app':' · web'}</small>`;
}

/* ===== render ===== */
function render(){
  const now=new Date(), s=st(), list=roster();
  $('clock').textContent=clockStr(now); $('date').textContent=dateStr(now);
  const outs=Object.keys(state.active).length, abs=list.filter(x=>att(x.id).status==='absent').length;
  $('cIn').textContent=list.length-outs-abs; $('cOut').textContent=outs; $('cAbs').textContent=abs;
  $('title').textContent = state.teacher ? `${state.teacher}'s Hifz Class` : 'Hifz Class';
  const nx=nextUp();
  $('sub').textContent= s==='preclass'?`Before class · ${hm(state.settings.startTime)}-${hm(state.settings.endTime)}`
    : s==='live'?`Since ${clockStr(state.session.startedAt)}${nx?` · next ${nx}`:''}`
    : s==='lunch'?`${state.session.pauseLabel||'Break'} since ${clockStr(state.session.lunchAt)}`
    : `Ended ${clockStr(state.session.endedAt)}`;

  const mb=$('mainBtn'); mb.className='start-btn'+(s==='live'?' end':s==='lunch'?' lunch':'');
  mb.textContent= s==='preclass'?'Start class':s==='live'?'End class':s==='lunch'?'End break':'Start again';

  const due=s==='live'?dueBreak():null; render.nudge=due?due.kind:'';
  const late=state.session.resumeAt&&nowMin()>=toMin(state.session.resumeAt);
  $('banner').innerHTML= s==='preclass'?`<div class="banner paper">Everyone is assumed present. Click a student who is not here to mark them absent. Once class starts, clicking a marked student records them tardy with the time.</div>`
    : due?`<div class="banner">${due.kind} is scheduled now, ${hm(due.start)} to ${hm(due.end)}. Individual break logging pauses while it runs.<button class="act" onclick="startPause('${due.kind}','${due.end}')">Start ${due.kind.toLowerCase()}</button></div>`
    : s==='lunch'?`<div class="banner${late?'':''}">${state.session.pauseLabel||'Break'} since ${clockStr(state.session.lunchAt)}.${state.session.resumeAt?` ${late?'Class was due back at':'Class resumes at'} ${hm(state.session.resumeAt)}.`:''} Individual break logging is paused.<button class="act" onclick="endPause()">End ${(state.session.pauseLabel||'break').toLowerCase()}</button></div>`
    : s==='ended'?`<div class="banner leaf">Class ended at ${clockStr(state.session.endedAt)}.<button class="act" onclick="openDaySummary()">View day summary</button><button class="act" style="margin-left:8px;background:var(--paper);color:var(--ink);border:1px solid var(--line)" onclick="resetDay()">Reset day</button></div>`:'';

  $('gridTitle').textContent= s==='preclass'?'Mark anyone who is absent':'Class';
  $('gridHint').textContent= s==='preclass'?'Tap a name to mark them not here':'Tap a student to log a break · tap again when they are back';

  const g=$('grid');
  g.innerHTML=list.map(x=>{
    const a=att(x.id), o=state.active[x.id];
    const fl=flagsOf(x.id);
    if(o) return `<button class="tile out ${isLong(o)?'long':''}" data-long="${+o.startAt}" data-lim="${o.allowMs||0}" onclick="tap('${x.id}')"><span class="tag">Back in</span><span class="name">${x.name}</span><span class="state">${o.label}${o.assignedMin?` ${o.assignedMin} min`:''} · <span data-t="${+o.startAt}">${fmtDur(now-o.startAt)}</span></span></button>`;
    if(a.status==='absent') return `<button class="tile deact" onclick="tap('${x.id}')">${s==='preclass'?'':'<span class="tag">Mark in</span>'}<span class="name">${x.name}</span><span class="state">${s==='preclass'?'Not here today':'Not here · tap to mark tardy'}</span></button>`;
    const tag = fl?`<span class="tag flag">⚑ ${fl}</span>`:a.status==='tardy'?`<span class="tag">Tardy ${clockStr(a.at)}</span>`:'';
    const line = s==='preclass'?'Present':(a.status==='tardy'&&fl)?`In class · tardy ${clockStr(a.at)}`:'In class';
    return `<button class="tile present" onclick="tap('${x.id}')">${tag}<span class="name">${x.name}</span><span class="state">${line}</span></button>`;
  }).join('');

  const outEntries=Object.entries(state.active).sort((a,b)=>a[1].startAt-b[1].startAt);
  $('outHint').textContent=outs||'';
  $('outList').innerHTML=outEntries.length?outEntries.map(([sid,a])=>`<div class="out-item ${isLong(a)?'long':''}" data-long="${+a.startAt}" data-lim="${a.allowMs||0}"><div class="who"><b>${nameOf(sid)}</b><span>${a.label} · left ${clockStr(a.startAt)}${a.allowMs?` · ${Math.round(a.allowMs/60000)} min allowed`:''}${a.overTrip?' · past daily limit':''}</span></div><div class="t" data-t="${+a.startAt}">${fmtDur(now-a.startAt)}</div><button class="back" onclick="ret('${sid}')">Back in</button></div>`).join('')
    :`<div class="empty"><b>Everyone is in class</b>Log a break and the timer appears here.</div>`;
  $('outList').classList.toggle('compact',outEntries.length>3);
  document.querySelector('.stage').classList.toggle('no-out',outEntries.length===0);
  fitGrid();
  // the drawer only rebuilds its HTML when explicitly told to (drawDrawer()
  // calls after a button action) - without this, a remote change arriving
  // via a Firestore listener while the drawer happens to be open would sit
  // in `state` correctly but never reach the screen until the drawer was
  // closed and reopened.
  if($('drawer').classList.contains('show')) drawDrawer();
  tick(); cacheLastClass();
}
/* Local-only instant-paint cache (plan 2.9) - never a source of truth, just
   lets boot() paint something real before Firestore's listeners answer.
   Cheap localStorage/Preferences write, not a Firestore write, so it has no
   bearing on the "zero writes while idle" rule. */
function cacheLastClass(){
  try{
    Store.set(CACHE_KEY,JSON.stringify({
      teacher:state.teacher, students:state.students, settings:state.settings,
      session:sessionToPlain(state.session), attendance:fullAttendancePlain(),
      active:Object.fromEntries(Object.entries(state.active).map(([sid,a])=>[sid,Object.assign({},a,{startAt:+a.startAt})])),
      breaks:state.breaks.map(b=>Object.assign({},b,{startAt:+b.startAt,endAt:b.endAt?+b.endAt:null}))
    }));
  }catch(e){}
}
function loadFromCache(){
  try{
    const raw=Store.get(CACHE_KEY); if(!raw) return false;
    const c=JSON.parse(raw);
    if(c.teacher) state.teacher=c.teacher;
    if(Array.isArray(c.students)) state.students=c.students;
    state.settings=mergeSettings(c.settings);
    if(c.session) state.session=plainToSession(c.session);
    if(c.attendance) state.attendance=plainToAttendance(c.attendance);
    ensureAttendance();
    if(c.active){ const out={}; Object.entries(c.active).forEach(([sid,a])=>{ out[sid]=Object.assign({},a,{startAt:new Date(a.startAt)}); }); state.active=out; }
    if(Array.isArray(c.breaks)) state.breaks=c.breaks.map(b=>Object.assign({},b,{startAt:new Date(b.startAt),endAt:b.endAt?new Date(b.endAt):null}));
    state.setup=true;
    return true;
  }catch(e){ return false; }
}
/* Same local reset resetDay() does, without the Firestore write - the new
   day's doc doesn't exist yet and will be created lazily by whichever
   writer fires first (see IMPLEMENTATION_PLAN.md 11, "day rollover at
   midnight: the today-listener must re-subscribe when the date changes"). */
function resetLocalDayState(){
  state.session={status:'preclass',startedAt:null,endedAt:null,lunchAt:null,pauseLabel:null,resumeAt:null};
  state.students.forEach(s=>state.attendance[s.id]={status:'present',at:null,note:''});
  state.active={}; state.breaks=[]; state.log=[];
}
/* Picks the grid shape that makes the whole roster fit the space this device
   actually has. Depends on both the box and the class size, so it cannot be
   expressed in CSS alone - 11 students and 25 students want different tiles on
   the same screen. Falls back to the densest legible layout (and scrolling)
   only when a roster genuinely cannot fit. */
function fitGrid(){
  const g=$('grid'); if(!g) return;
  const n=roster().length; if(!n) return;
  const cs=getComputedStyle(g), GAP=8, MINW=96, MINH=56;
  const W=g.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const H=g.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(W<=0||H<=0) return;                                    // not laid out yet
  let best=null;
  for(let cols=1;cols<=n;cols++){
    const rows=Math.ceil(n/cols);
    const tw=(W-GAP*(cols-1))/cols, th=(H-GAP*(rows-1))/rows;
    if(tw<MINW||th<MINH) continue;
    const score=Math.min(tw/1.7,th);                        // names read horizontally, so favour width a little
    if(!best||score>best.score) best={cols,th,tw,score};
  }
  const fits=!!best;
  if(!best){
    const cols=Math.max(1,Math.floor((W+GAP)/(MINW+GAP)));
    best={cols,th:MINH,tw:(W-GAP*(cols-1))/cols};
  }
  g.style.gridTemplateColumns=`repeat(${best.cols},minmax(0,1fr))`;
  g.style.gridAutoRows=fits?Math.floor(best.th)+'px':MINH+'px';
  g.classList.toggle('dense',best.th<78);
  const apply=px=>{
    g.style.setProperty('--name',px+'px');
    g.style.setProperty('--sub',Math.max(10,Math.round(px*.74))+'px');
    g.style.setProperty('--tag',Math.max(9,Math.round(px*.62))+'px');
  };
  // Start from an estimate, then shrink until the tallest tile's content really
  // fits its row. Measuring beats predicting: how tall a tile needs to be depends
  // on name length, whether a badge is showing and the font that actually loaded.
  let px=Math.max(13,Math.min(20,Math.round(Math.min(best.tw/6.4,best.th/3.1))));
  apply(px);
  for(let i=0;i<8&&px>13;i++){
    let over=0;
    g.querySelectorAll('.tile').forEach(t=>{ over=Math.max(over,t.scrollHeight-t.clientHeight); });
    if(over<=0) break;
    apply(--px);
  }                   // drop the redundant "In class" line when short
}
let fitT; addEventListener('resize',()=>{ clearTimeout(fitT); fitT=setTimeout(fitGrid,120); });
addEventListener('orientationchange',()=>setTimeout(fitGrid,250));
function tick(){
  if(ORG_ID && TODAY_ID && dayId(new Date())!==TODAY_ID){ resetLocalDayState(); attachDayListeners(); return render(); }
  const now=Date.now();
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=fmtDur(now-(+el.dataset.t)));
  document.querySelectorAll('[data-long]').forEach(el=>{const lim=+el.dataset.lim||0; el.classList.toggle('long',lim>0&&now-(+el.dataset.long)>lim);});
  const due=st()==='live'&&dueBreak()?dueBreak().kind:''; if(due!==render.nudge) return render();
  const d=new Date(); $('clock').textContent=clockStr(d); $('date').textContent=dateStr(d);
}
/* Boot sequence per IMPLEMENTATION_PLAN.md 2.9: read session -> paint from
   the local cache (or, for an install upgrading from before Firestore, the
   legacy keys) -> await auth -> attach listeners -> render as data arrives.
   A stored orgId that no longer exists must never crash - it just falls
   back to the setup screen. */
(async function boot(){
  await Store.hydrate([PKEY,KEY,HKEY,SESSION_ORG_KEY,SESSION_CLASS_KEY,CACHE_KEY,MIGRATION_FLAG_KEY,MIGRATION_FAILURES_KEY]);
  if(!loadFromCache()){ loadProfile(); load(); }
  render(); setInterval(tick,1000);
  const sessionOrgId=Store.get(SESSION_ORG_KEY);
  if(sessionOrgId){
    await attachToOrg(sessionOrgId);
  } else if(state.setup){
    bootstrapOrgFromLocal();                    // pre-Phase-2 install: has a class locally, no org yet
  } else {
    openSetup();
  }
})();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
